plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dhbhojani.kharcha'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dhbhojani.kharcha'
        minSdk 29
        targetSdk 34
        versionCode 24
        versionName '5.10'
    }

    signingConfigs {
        fixed {
            storeFile file('kharcha.jks')
            storePassword 'kharcha123'
            keyAlias 'kharcha'
            keyPassword 'kharcha123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'
}
