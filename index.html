<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kharcha</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0f172a;--mut:#6b7280;--line:#eceef2;--pri:#0f766e;--soft:#e6f4f2;--red:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:18px 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:5px 0;color:var(--ink);outline:none}
input:focus{border-color:var(--pri)}
h2{font-size:22px;margin:4px 2px 14px;letter-spacing:-.3px}
.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h4{margin:0 0 10px;font-size:15px}
.hero{padding:6px 2px 2px}
.hero .lbl{color:var(--mut);font-size:13px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0 4px}
.hero .sub{color:var(--mut);font-size:14px}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--pri);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:16px;margin:16px 0 4px}
.day{display:flex;justify-content:space-between;margin:20px 4px 6px;font-size:13px;font-weight:600;color:var(--mut)}
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--bg)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.banner{display:block;width:100%;text-align:left;background:#fff7ed;color:#9a3412;border-radius:14px;padding:12px 14px;margin:12px 0 0;font-weight:600}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:2px 16px}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--pri);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:up .18s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.grab{width:38px;height:4px;background:var(--line);border-radius:4px;margin:6px auto 12px}
.sheet h3{margin:0 0 8px;font-size:18px}
.amt{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--pri);margin:4px 0 14px}
.amt span{font-size:28px;font-weight:700;color:var(--mut)}
.amt input{border:0;font-size:36px;font-weight:800;padding:4px 0;margin:0;background:transparent}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 10px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:14px;background:var(--bg);font-size:11.5px;line-height:1.2;border:1.5px solid transparent}
.cats button b{font-size:21px;font-weight:400}
.cats button.on{background:var(--soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.cats.err button{border-color:#fecaca}
.chips{display:flex;gap:8px;margin:6px 0;flex-wrap:wrap}
.chips button{padding:7px 14px;border-radius:999px;background:var(--bg);font-weight:500;border:1.5px solid transparent}
.chips button.on{background:var(--soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;text-align:center;background:var(--bg);margin-top:8px}
.btn.pri{background:var(--pri);color:#fff}
.btn.danger{color:var(--red)}
.row{display:flex;gap:10px}.row .btn{flex:1}
.atts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.att{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:11px;color:var(--mut);text-align:center;cursor:pointer}
.att img{width:100%;height:100%;object-fit:cover}
.att .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:22px}
.attadd{width:72px;height:72px;border-radius:12px;border:1.5px dashed #cbd5e1;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.attadd b{font-size:20px;font-weight:400}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:0 0 4px}
.mnav button{font-size:22px;padding:4px 14px;color:var(--mut)}
.mnav b{font-size:16px}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0;width:100%;text-align:left}
.crow .g{flex:1;min-width:0}
.bar{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.daily{display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:6px}
.daily div{flex:1;background:var(--pri);opacity:.85;border-radius:3px 3px 0 0;min-height:2px}
.daily div.z{background:var(--line)}
.dlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:4px}
.stat{display:flex;gap:8px}.stat div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}.stat b{display:block;font-size:19px;color:var(--ink)}
label.file{display:block;text-align:center;padding:16px;border:1.5px dashed #99d5cc;border-radius:14px;color:var(--pri);font-weight:700;cursor:pointer;margin-top:8px}
label.file input,label.attadd input{display:none}
.mitem{padding:12px 0;border-bottom:1px solid var(--line)}.mitem:last-child{border-bottom:0}
.mitem .top{display:flex;justify-content:space-between;gap:10px}
.mini{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.mini button{flex:none;font-size:19px;width:40px;height:40px;border-radius:12px;background:var(--bg);border:1.5px solid transparent}
.mini button.on{border-color:var(--pri);background:var(--soft)}
.srow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.srow:last-child{border-bottom:0}
.srow span{flex:1}
.srow .chev{color:#cbd5e1;font-size:18px;flex:none}
.status{font-size:13px;font-weight:700}
.ok{color:var(--pri)}.bad{color:var(--red)}
.catrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow span{flex:1}.catrow button{color:var(--red);font-size:13px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw}
.foot{text-align:center;color:#9ca3af;font-size:12px;margin:18px 0}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs">
  <button data-t="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-t="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Reports</button>
  <button data-t="check"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h6"/></svg>Statement</button>
  <button data-t="more"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</nav>
<div id="ov" class="ov hidden"><div class="sheet" id="sheet"></div></div>

<script>
const VERSION='4.0';
const APP=window.KharchaApp||null;
const POOLDRIVE='io.github.dhbhojani12.pooldrive';

/* ---------- data ---------- */
const LS='kharcha.v1';
const DEF_CATS=[['food','Food','🍔'],['groc','Groceries','🛒'],['travel','Travel','🚕'],['shop','Shopping','🛍️'],['bills','Bills','💡'],['study','Study','📚'],['health','Health','💊'],['fun','Fun','🎬'],['friends','Friends','🤝'],['home','Home','🏠'],['gift','Gifts','🎁'],['other','Other','📦']].map(([id,name,emoji])=>({id,name,emoji}));
const MODES=['UPI','Cash','Card','Bank'];
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&Array.isArray(s.expenses)){s.cats=s.cats||DEF_CATS.slice();s.rules=s.rules||{};s.seen=s.seen||{};s.expenses=s.expenses.filter(e=>e.status!=='pending');return s}}catch(e){}return{v:2,expenses:[],cats:DEF_CATS.slice(),rules:{},seen:{}}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save – storage full?')}syncNative()}
function syncNative(){if(APP&&APP.setCats){try{APP.setCats(JSON.stringify(S.cats.map(c=>({id:c.id,name:c.name,emoji:c.emoji}))));APP.setRules(JSON.stringify(S.rules))}catch(e){}}}

/* ---------- attachments (stored on the phone, IndexedDB) ---------- */
let _db;
function db(){return _db||(_db=new Promise((res,rej)=>{const r=indexedDB.open('kharcha',1);r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
const toAB=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsArrayBuffer(blob)});
const unpack=o=>o?{...o,blob:o.data?new Blob([o.data],{type:o.type}):o.blob}:o;
async function fput(o){const data=o.data||await toAB(o.blob);const rec={id:o.id,name:o.name,type:o.type,ts:o.ts,data};const d=await db();return new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(rec);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await db();return new Promise(res=>{const r=d.transaction('files').objectStore('files').get(id);r.onsuccess=()=>res(unpack(r.result));r.onerror=()=>res(null)})}
async function fdel(id){const d=await db();return new Promise(res=>{const t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=res;t.onerror=res})}
async function fall(){const d=await db();return new Promise(res=>{const r=d.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res((r.result||[]).map(unpack));r.onerror=()=>res([])})}
async function shrink(file){
  if(!/^image\//.test(file.type)||file.size<350000)return file;
  try{const bm=await createImageBitmap(file);const sc=Math.min(1,1600/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.75));return b&&b.size<file.size?new File([b],(file.name||'photo').replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}}
const b64=blob=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.readAsDataURL(blob)});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const view=$('#view');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==='other')||{id:'other',name:'Other',emoji:'📦'};
const key=s=>(s||'').toLowerCase().replace(/[^a-z0-9@.]/g,'');
const ym=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthName=m=>{const[y,mm]=m.split('-');return MN[+mm-1]+' '+y};
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()};
const sameDay=(a,b)=>sod(a)===sod(b);
const sum=a=>a.reduce((s,e)=>s+e.amt,0);
const tm=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
function dayLabel(t){const n=Date.now();if(sameDay(t,n))return'Today';if(sameDay(t,n-864e5))return'Yesterday';const d=new Date(t);return d.getDate()+' '+MN[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function dtLocal(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Needs internet the first time'));document.head.appendChild(s)})}
const loadXLSX=()=>window.XLSX?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
const loadZip=()=>window.JSZip?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:0};

const KW=[[/swiggy|zomato|domino|mcdonald|kfc|pizza|cafe|restaurant|hotel|food|bakery|chai|tea|canteen|burger|starbucks/i,'food'],
[/blinkit|zepto|bigbasket|dmart|instamart|grocer|kirana|supermarket|jiomart|milk|dairy/i,'groc'],
[/uber|ola|rapido|irctc|metro|railway|petrol|fuel|indianoil|iocl|hpcl|bpcl|fastag|redbus|makemytrip|indigo|parking/i,'travel'],
[/amazon|flipkart|myntra|ajio|meesho|nykaa|croma|decathlon/i,'shop'],
[/airtel|jio|vodafone|\bvi\b|bsnl|electric|power|recharge|broadband|gas|bill|dth/i,'bills'],
[/icai|book|udemy|course|coaching|xerox|stationery|exam/i,'study'],
[/apollo|pharm|medplus|hospital|clinic|1mg|netmeds|chemist|medical/i,'health'],
[/netflix|spotify|hotstar|bookmyshow|prime|pvr|inox|youtube/i,'fun']];
const guessCat=s=>{for(const[r,c]of KW)if(r.test(s||''))return S.cats.some(x=>x.id===c)?c:'';return''};
const suggest=(payee,extra)=>S.rules[key(payee)]||guessCat([payee,extra].join(' '));
function learn(payee,c){if(payee&&c)S.rules[key(payee)]=c}
const catGrid=(sel,id)=>`<div class="cats" id="${id}">${S.cats.map(c=>`<button data-c="${c.id}" class="${c.id===sel?'on':''}"><b>${c.emoji}</b>${esc(c.name)}</button>`).join('')}</div>`;
function bindPick(el,attr,cb){el.addEventListener('click',ev=>{const b=ev.target.closest(`button[${attr}]`);if(!b)return;el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');el.classList.remove('err');cb&&cb(b.getAttribute(attr))})}
const picked=(el,attr)=>{const b=el.querySelector('button.on');return b?b.getAttribute(attr):''};

/* ---------- bottom sheet ---------- */
const urls=[];let onSheetClose=null;
function openSheet(html,mount){onSheetClose=null;$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#ov').classList.remove('hidden');mount&&mount($('#sheet'))}
function closeSheet(){const f=onSheetClose;onSheetClose=null;if(f)f();$('#ov').classList.add('hidden');$('#sheet').innerHTML='';urls.splice(0).forEach(u=>URL.revokeObjectURL(u));if(Q.length)setTimeout(nextQueued,300)}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

/* ---------- add / edit expense (with bills) ---------- */
function addSheet(e){
  const x=Object.assign({amt:'',cat:'',mode:'UPI',payee:'',note:'',ts:Date.now(),att:[]},e||{});
  let att=(x.att||[]).slice();const added=[],removed=[];let saved=false;
  openSheet(`<h3>${x.id?'Edit expense':'Add expense'}</h3>
  <div class="amt"><span>₹</span><input id="fAmt" inputmode="decimal" placeholder="0" value="${x.amt||''}"></div>
  ${catGrid(x.cat,'fCats')}
  <input id="fPayee" placeholder="Paid to" value="${esc(x.payee)}">
  <input id="fNote" placeholder="Note" value="${esc(x.note)}">
  <div class="chips" id="fMode">${MODES.map(m=>`<button data-m="${m}" class="${m===x.mode?'on':''}">${m}</button>`).join('')}</div>
  <input id="fTs" type="datetime-local" value="${dtLocal(x.ts)}">
  <div class="small muted" style="margin:10px 2px 0">Bill / invoice</div>
  <div class="atts" id="fAtts"></div>
  <button class="btn pri" id="fSave">Save</button>
  ${x.id?'<button class="btn danger" id="fDel">Delete expense</button>':''}`,sh=>{
    onSheetClose=()=>{if(!saved)added.forEach(id=>fdel(id))};
    const cats=sh.querySelector('#fCats');bindPick(cats,'data-c');bindPick(sh.querySelector('#fMode'),'data-m');
    sh.querySelector('#fPayee').addEventListener('change',ev=>{if(!picked(cats,'data-c')){const s=suggest(ev.target.value);if(s)cats.querySelector(`[data-c="${s}"]`)?.classList.add('on')}});
    if(!x.id)setTimeout(()=>sh.querySelector('#fAmt')?.focus(),150);
    const box=sh.querySelector('#fAtts');
    async function draw(){
      let h='';
      for(const id of att){const f=await fget(id);if(!f)continue;
        if(/^image\//.test(f.type)){const u=URL.createObjectURL(f.blob);urls.push(u);h+=`<div class="att" data-v="${id}"><img src="${u}"><button class="x" data-x="${id}">✕</button></div>`}
        else h+=`<div class="att" data-v="${id}">📄<br>${esc((f.name||'file').slice(0,12))}<button class="x" data-x="${id}">✕</button></div>`}
      h+=`<label class="attadd"><b>📷</b>Camera<input type="file" accept="image/*" capture="environment" data-in></label><label class="attadd"><b>📎</b>File / PDF<input type="file" accept="image/*,application/pdf" multiple data-in></label>`;
      box.innerHTML=h;
      box.querySelectorAll('[data-in]').forEach(inp=>inp.onchange=async ev=>{
        for(const f0 of ev.target.files){if(f0.size>15e6){toast('File too big (max 15 MB)');continue}
          const f=await shrink(f0);const id='f'+uid();await fput({id,name:f.name||f0.name||'file',type:f.type||f0.type,blob:f,ts:Date.now()});att.push(id);added.push(id)}
        draw()});
      box.querySelectorAll('[data-x]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const id=b.dataset.x;att=att.filter(a=>a!==id);removed.push(id);draw()});
      box.querySelectorAll('[data-v]').forEach(d=>d.onclick=()=>viewFile(d.dataset.v));
    }
    draw();
    sh.querySelector('#fSave').onclick=()=>{
      const amt=parseAmt(sh.querySelector('#fAmt').value);if(!amt){toast('Enter an amount');return}
      const c=picked(cats,'data-c');if(!c){cats.classList.add('err');toast('Pick a category');return}
      const r={...x,amt,cat:c,mode:picked(sh.querySelector('#fMode'),'data-m')||'UPI',payee:sh.querySelector('#fPayee').value.trim(),note:sh.querySelector('#fNote').value.trim(),ts:new Date(sh.querySelector('#fTs').value).getTime()||Date.now(),att};
      if(!att.length)delete r.att;
      if(x.id){const i=S.expenses.findIndex(z=>z.id===x.id);S.expenses[i]=r}else{r.id=uid();r.src=x.src||'manual';S.expenses.push(r)}
      removed.forEach(id=>fdel(id));
      learn(r.payee,c);save();saved=true;closeSheet();render();toast('Saved ✓')};

function num(v){if(typeof v==='number')return v;const n=parseFloat(String(v||'').replace(/[,₹\s]/g,'').replace(/(dr|cr)$/i,''));return isFinite(n)?n:0}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return new Date(v.getFullYear(),v.getMonth(),v.getDate(),12);
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12)}
  const s=String(v||'').trim();let m=s.match(/^(\d{1,2})[\/\-. ]([A-Za-z]{3,9}|\d{1,2})[\/\-. ,]*(\d{2,4})/);
  if(m){const mo=isNaN(m[2])?MN.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase()):+m[2]-1;let yr=+m[3];if(yr<100)yr+=2000;if(mo<0||mo>11)return null;return new Date(yr,mo,+m[1],12)}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3],12);return null}
const SKIP=new Set(['upi','imps','neft','rtgs','pos','ach','nach','dr','cr','p2a','p2m','ref','txn','payment','paid','to','by','from','transfer','to transfer','by transfer','mob','ib','inb','bil','onl','ecom','atm','wdl','cash','mmt','sent','pay','collect']);
function extractPayee(n){const s=String(n).replace(/\s+/g,' ').trim();
  for(let p of s.split(/[\/|:]+|\s-\s|-(?=\S)/)){p=p.trim();const l=p.toLowerCase();
    if(!p||SKIP.has(l)||/^\d+$/.test(p)||p.includes('@')||/^[A-Z]{4}0[A-Z0-9]{6}$/.test(p)||p.replace(/[^a-z]/gi,'').length<3||/^(upi|ref|txn)\s*\d/i.test(p))continue;return p.slice(0,40)}
  return s.slice(0,40)}
const detMode=n=>/upi/i.test(n)?'UPI':/pos|card|ecom/i.test(n)?'Card':/atm|cash/i.test(n)?'Cash':'Bank';
async function parseStatement(file){
  await loadXLSX();
  const wb=/\.csv$/i.test(file.name)?XLSX.read(await file.text(),{type:'string',raw:true}):XLSX.read(new Uint8Array(await file.arrayBuffer()),{type:'array',cellDates:true});
  const out=[];
  for(const name of wb.SheetNames){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});let h=-1,ci={};
    for(let i=0;i<Math.min(a.length,80);i++){const r=a[i].map(x=>String(x).toLowerCase().replace(/\s+/g,' ').trim());
      const di=r.findIndex(x=>/^(txn |tran |transaction |post |posting )?(date|dt)\b/.test(x)&&!/value/.test(x));
      const ni=r.findIndex(x=>/narration|description|particular|remark|details/.test(x));
      const wi=r.findIndex(x=>/withdraw|debit|^dr\b|dr\.? ?amount|amount ?\(?dr/.test(x));
      const ai=r.findIndex(x=>/^amount|txn amount|transaction amount/.test(x)&&!/dr|cr|debit|credit|withdraw|deposit/.test(x));
      const ti=r.findIndex(x=>/^(dr ?\/ ?cr|cr ?\/ ?dr|type|txn type|debit\/credit)$/.test(x));
      if(di>-1&&ni>-1&&(wi>-1||(ai>-1&&ti>-1))){h=i;ci={d:di,n:ni,w:wi,a:ai,t:ti};break}}
    if(h<0)continue;
    for(let i=h+1;i<a.length;i++){const r=a[i];const amt=ci.w>-1?num(r[ci.w]):(/^d/i.test(String(r[ci.t]).trim())?num(r[ci.a]):0);
      if(!amt||amt<=0)continue;const d=parseDate(r[ci.d]);if(!d)continue;const narr=String(r[ci.n]||'').replace(/\s+/g,' ').trim();
      out.push({d:d.getTime(),amt:Math.round(amt*100)/100,narr,payee:extractPayee(narr),mode:detMode(narr)})}}
  return out;
}
const rowKey=r=>r.d+'|'+r.amt+'|'+r.narr.slice(0,60);
function reconcile(rows){const used=new Set();
  return rows.map(r=>{const k=rowKey(r);if(S.seen[k])return{...r,key:k,st:'seen'};
    const m=S.expenses.filter(e=>!used.has(e.id)&&e.mode!=='Cash'&&Math.abs(e.amt-r.amt)<0.5&&Math.abs(sod(e.ts)-sod(r.d))<=864e5*1.5).sort((a,b)=>Math.abs(sod(a.ts)-r.d)-Math.abs(sod(b.ts)-r.d))[0];
    if(m){used.add(m.id);return{...r,key:k,st:'matched'}}
    return{...r,key:k,st:'missing',cat:suggest(r.payee,r.narr)}})}
function vCheck(){

function recHtml(r,miss){const n=s=>r.filter(x=>x.st===s).length;

function addFromRec(x,c){S.expenses.push({id:uid(),amt:x.amt,cat:c,mode:x.mode,payee:x.payee,note:'',ts:x.d,src:'statement'});learn(x.payee,c);S.seen[x.key]=1;x.st='seen'}

function exportXlsx(list,fname){loadXLSX().then(()=>{
  const rows=[...list].sort((a,b)=>a.ts-b.ts).map(e=>({Date:new Date(e.ts).toLocaleDateString('en-IN'),Time:e.src==='statement'?'':tm(e.ts),Amount:e.amt,Category:cat(e.cat).name,'Paid to':e.payee||'',Mode:e.mode,Note:e.note||'',Bills:(e.att||[]).length||''}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Expenses');
  const months=[...new Set(list.map(e=>ym(e.ts)))].sort();
  const sm=S.cats.map(c=>{const o={Category:c.name};months.forEach(m=>o[monthName(m)]=sum(list.filter(e=>e.cat===c.id&&ym(e.ts)===m)));o.Total=sum(list.filter(e=>e.cat===c.id));return o}).filter(o=>o.Total);

async function makeBackup(){
  await loadZip();const z=new JSZip();
  z.file('kharcha.json',JSON.stringify({...S,backupAt:Date.now(),app:VERSION}));
  const files=await fall();const meta=[];
  for(const f of files){z.file('files/'+f.id,f.data||await toAB(f.blob));meta.push({id:f.id,name:f.name,type:f.type,ts:f.ts})}
  z.file('files.json',JSON.stringify(meta));
  return{name:'Kharcha-backup-'+new Date().toISOString().slice(0,10)+'.zip',b64:await z.generateAsync({type:'base64',compression:'DEFLATE'})};
}
async function backupTo(where){
  if(APP&&!APP.shareFile&&where!=='save'){toast('Update the Kharcha app to back up to PoolDrive – saving to phone instead');where='save'}
  toast('Preparing backup…');
  try{const b=await makeBackup();

    else if(APP&&where==='share')APP.shareFile(b.name,b.b64,'application/zip','');

async function restore(file){
  try{
    let data,files=[];
    if(/\.json$/i.test(file.name)){data=JSON.parse(await file.text())}
    else{await loadZip();const z=await JSZip.loadAsync(file);data=JSON.parse(await z.file('kharcha.json').async('string'));
      const meta=z.file('files.json')?JSON.parse(await z.file('files.json').async('string')):[];
      for(const m of meta){const f=z.file('files/'+m.id);if(f)files.push({...m,data:await f.async('arraybuffer')})}}
    if(!Array.isArray(data.expenses))throw 0;
    if(!confirm(`Restore ${data.expenses.length} expenses${files.length?' and '+files.length+' bills':''}? This replaces what is on this phone.`))return;
    for(const f of files)await fput(f);
    S={v:2,expenses:data.expenses.filter(e=>e.status!=='pending'),cats:data.cats||DEF_CATS.slice(),rules:data.rules||{},seen:data.seen||{},lastBackup:data.lastBackup};
    save();render();toast('Restored ✓');
  }catch(e){toast('Not a valid Kharcha backup')}
}

  const bs=$('#bkShare');if(bs)bs.onclick=()=>backupTo('share');
  $('#bkSave').onclick=()=>backupTo('save');
  $('#rs').onchange=ev=>{const f=ev.target.files[0];if(f)restore(f)};
  view.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=cat(b.dataset.del);const n=S.expenses.filter(e=>e.cat===c.id).length;if(!confirm(`Remove “${c.name}”?`+(n?` ${n} expenses move to Other.`:'')))return;S.expenses.forEach(e=>{if(e.cat===c.id)e.cat='other'});S.cats=S.cats.filter(x=>x.id!==c.id);Object.keys(S.rules).forEach(k=>{if(S.rules[k]===c.id)delete S.rules[k]});save();render()});
  $('#nAdd').onclick=()=>{const nm=$('#nName').value.trim();if(!nm)return toast('Type a name');S.cats.splice(S.cats.length-1,0,{id:'c'+uid(),name:nm,emoji:$('#nEmoji').value.trim()||'🏷️'});save();render();toast('Category added')};
  $('#xAll').onclick=()=>S.expenses.length?exportXlsx(S.expenses,'Kharcha-all'):toast('Nothing to export yet');
  $('#wipe').onclick=async()=>{if(confirm('Erase ALL expenses and bills? Take a backup first!')&&confirm('Really erase everything?')){localStorage.removeItem(LS);for(const f of await fall())await fdel(f.id);S=load();rec=null;render();toast('Erased')}};
}
function diagSheet(){
  let log=[];try{log=JSON.parse(APP.getLog())}catch(e){}
  log=log.filter(l=>/screen/i.test(l.why||''));
  openSheet(`<h3>Capture log</h3><p class="small muted" style="margin-top:0">Payment screens Kharcha has read (latest first).</p>
  ${log.length?log.map(l=>`<div class="mitem"><div class="top"><b>${esc(String(l.t).split('\n')[0].replace(/^Screen:\s*/,''))}</b><span class="small muted">${dayLabel(l.ts)} ${tm(l.ts)}</span></div><div class="small muted" style="word-break:break-word">${esc((String(l.t).split('\n')[1]||'').replace(/^RAW:\s*/,''))}</div></div>`).join(''):'<p class="muted">Nothing yet. Make a payment, then check again.</p>'}`);
}

/* ---------- start ---------- */
render();
if(new URLSearchParams(location.search).get('a')==='add')addSheet();
if(location.search)history.replaceState(null,'',location.pathname);
if(APP){syncNative();setTimeout(()=>window.kharchaPoll(),500);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(()=>{window.kharchaPoll();render()},300)})}
else if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
