<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f6fc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kharcha</title>
<style>
:root{
 --bg:#f3f6fc; --card:#ffffff; --card2:#eef3fb; --ink:#0f1b33; --mut:#5b6b85; --faint:#8a97ad;
 --line:#eef2f8; --edge:#dfe6f2; --ink2:#1e5eff; --onink:#d6e2ff; --inkcard:rgba(255,255,255,.16);
 --accent:#1e5eff; --accentink:#ffffff; --red:#c62828; --redbg:#fdecec; --okbg:#e3f6ec; --okink:#0b7a4b;
 --sheet:#ffffff; --shadow:0 2px 10px rgba(15,27,51,.06); --soft:#e8efff;
}
html[data-theme="dark"]{
 --bg:#0b1220; --card:#131c2e; --card2:#1a2438; --ink:#eef2fa; --mut:#9aa7bf; --faint:#7887a3;
 --line:#1f2a40; --edge:#27344d; --ink2:#1a3a8f; --inkcard:rgba(255,255,255,.12); --accent:#5b8cff; --accentink:#0b1220;
 --sheet:#131c2e; --redbg:#3a1a1a; --okbg:#10352a; --okink:#6fd9a8; --red:#ff8b7e; --soft:#1c2a48;
 --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px 18px 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--edge);border-radius:14px;background:var(--card);color:var(--ink);outline:none;margin:0}
input:focus{border-color:var(--accent)}
svg{display:block}
.g{font-family:"Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.4px}
h2{font-size:23px;margin:6px 2px 14px;font-weight:700}
.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h4{margin:0 0 10px;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .d{font-size:13px;color:var(--mut)}
.top .n{font-size:23px;font-weight:700}
.mbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:1px solid var(--edge);border-radius:20px;background:var(--card);font-size:13px;font-weight:600}
.hero{background:var(--ink2);border:1px solid var(--inkcard);border-radius:28px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:12px}
html:not([data-theme="dark"]) .hero{background:#0e1513;border-color:#0e1513}
.hero .lbl{font-size:13px;color:var(--onink)}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-1.6px;line-height:1}
.pill{padding:6px 10px;border-radius:12px;background:var(--inkcard);font-size:12px;font-weight:600;color:#e7f1ed}
html:not([data-theme="dark"]) .pill{background:#1e2a26}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px}
.spark div{flex:1;background:#2a3833;border-radius:3px;min-height:3px}
.spark div.on{background:var(--accent)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.quick button{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:18px;font-weight:700;font-size:15px}
.quick .a{background:var(--accent);color:var(--accentink)}
.quick .b{background:var(--card);border:1px solid var(--edge)}
.day{display:flex;justify-content:space-between;margin:20px 4px 8px;font-size:13px;font-weight:600;color:var(--mut)}
.list{background:var(--card);border-radius:22px;padding:2px 14px;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:700;font-size:15px;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.banner{display:block;width:100%;text-align:left;background:#fff7ed;color:#9a3412;border-radius:16px;padding:13px 15px;margin:12px 0 0;font-weight:600;font-size:14px}
html[data-theme="dark"] .banner{background:#2e1c0c;color:#fdba74}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 18px calc(18px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.tabs .bar{pointer-events:auto;width:100%;max-width:524px;height:64px;border-radius:32px;background:#0e1513;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
html[data-theme="dark"] .tabs .bar{background:#17201d;border:1px solid #26302c}
.tabs button{width:48px;height:48px;border-radius:24px;display:grid;place-items:center}
.tabs button svg{width:22px;height:22px;fill:none;stroke:var(--onink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:#1e2a26}
html[data-theme="dark"] .tabs button.on{background:#22302b}
.tabs button.on svg{stroke:var(--accent)}
.tabs .plus{width:54px;height:54px;border-radius:27px;background:var(--accent)}
.tabs .plus svg{stroke:var(--accentink);stroke-width:2.4}
.ov{position:fixed;inset:0;background:rgba(5,10,9,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease}
@keyframes up{from{transform:translateY(26px);opacity:.6}}
.grab{width:38px;height:5px;background:var(--edge);border-radius:3px;margin:6px auto 10px}
.sheet h3{margin:0 0 10px;font-size:19px;font-weight:700}
.amt{display:flex;align-items:baseline;justify-content:center;gap:5px;margin:14px 0 4px}
.amt span{font-size:28px;font-weight:600;color:var(--faint)}
.amt input{border:0;background:transparent;padding:0;width:auto;max-width:230px;font-size:50px;font-weight:700;letter-spacing:-2px;text-align:center;font-family:"Space Grotesk",Inter,sans-serif}
.seg{display:grid;gap:4px;padding:4px;background:var(--card2);border-radius:16px}
.seg button{height:40px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:#0e1513;color:#fff;font-weight:700}
html[data-theme="dark"] .seg button.on{background:var(--accent);color:#0e1513}
.lab{font-size:13px;font-weight:600;color:var(--mut);margin:16px 2px 8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:16px;background:var(--card2);border:2px solid transparent;font-size:11.5px;line-height:1.15}
.cats button .ico{width:34px;height:34px;border-radius:11px}
.cats button .ico svg{width:18px;height:18px}
.cats button.on{border-color:var(--ink);background:var(--card);font-weight:700}
html[data-theme="dark"] .cats button.on{border-color:var(--accent)}
.cats.err button{border-color:#fca5a5}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:18px;font-weight:700;font-size:15.5px;background:var(--card2);margin-top:10px;text-decoration:none;color:var(--ink)}
.btn.pri{background:#0e1513;color:#fff}
html[data-theme="dark"] .btn.pri{background:var(--accent);color:#0e1513}
.btn.danger{color:var(--red);background:transparent}
.row{display:flex;gap:10px}.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--edge);background:var(--card);font-size:13px;font-weight:600}
.chips button.on{background:#0e1513;color:#fff;border-color:#0e1513}
html[data-theme="dark"] .chips button.on{background:var(--accent);color:#0e1513;border-color:var(--accent)}
.mnav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:20px;padding:2px}
.mnav button{width:38px;height:38px;font-size:18px;color:var(--mut)}
.mnav b{font-size:13px;font-weight:600;padding:0 2px}
.badge{padding:6px 10px;border-radius:12px;background:var(--okbg);color:var(--okink);font-size:12px;font-weight:700;white-space:nowrap}
.badge.up{background:var(--redbg);color:var(--red)}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:4px;height:92px;margin-top:12px}
.bars div{flex:1;border-radius:5px 5px 2px 2px;background:#cfe9df;min-height:3px}
html[data-theme="dark"] .bars div{background:#234038}
.bars div.hi{background:#0e1513}
html[data-theme="dark"] .bars div.hi{background:var(--accent)}
.dlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;border-bottom:1px solid var(--line);font-size:15px}
.srow:last-child{border-bottom:0}
.srow .ico{width:32px;height:32px;border-radius:10px}
.srow .ico svg{width:17px;height:17px}
.srow .s{flex:1;min-width:0}
.srow .v{font-size:13.5px;color:var(--mut)}
.srow .chev{width:16px;height:16px;flex:none;stroke:var(--faint);stroke-width:2;fill:none;stroke-linecap:round}
.on-pill{padding:4px 10px;border-radius:10px;background:var(--okbg);color:var(--okink);font-size:12px;font-weight:700}
.off-pill{padding:4px 10px;border-radius:10px;background:var(--redbg);color:var(--red);font-size:12px;font-weight:700}
.ghead{font-size:12px;font-weight:700;color:var(--mut);margin:18px 8px 6px;text-transform:uppercase;letter-spacing:.7px}
.fmt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--edge);background:var(--card);text-align:left;margin-bottom:8px}
.fmt.on{border-color:var(--ink)}
html[data-theme="dark"] .fmt.on{border-color:var(--accent)}
.fmt .tag{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.fmt .t{flex:1}.fmt .t b{display:block;font-size:14.5px}.fmt .t small{display:block;color:var(--mut);font-size:12.5px}
.fmt .dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--edge);display:grid;place-items:center;flex:none}
.fmt.on .dot{border-color:var(--ink)}
html[data-theme="dark"] .fmt.on .dot{border-color:var(--accent)}
.fmt .dot i{width:10px;height:10px;border-radius:5px;background:transparent}
.fmt.on .dot i{background:var(--ink)}
html[data-theme="dark"] .fmt.on .dot i{background:var(--accent)}
.catrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.catrow span{flex:1}
.catrow button{color:var(--red);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#0e1513;color:#fff;padding:11px 16px;border-radius:14px;z-index:30;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
html[data-theme="dark"] .toast{background:#273430}
.foot{text-align:center;color:var(--faint);font-size:12px;margin:18px 0 6px}
.mitem{padding:12px 0;border-bottom:1px solid var(--line)}.mitem:last-child{border-bottom:0}
.mitem .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tapbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 18px;border-radius:22px;border:2px dashed var(--edge);background:var(--card);text-align:center}
.tapbox.live{border-color:var(--accent);border-style:solid}
.wave{width:76px;height:76px;border-radius:38px;display:grid;place-items:center;background:var(--card2)}
.wave svg{width:34px;height:34px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round}
.tapbox.live .wave{background:var(--okbg);animation:pulse 1.4s ease-in-out infinite}
.tapbox.live .wave svg{stroke:var(--okink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.balcard{background:#0e1513;border-radius:26px;padding:20px;color:#fff}
html[data-theme="dark"] .balcard{background:#17201d;border:1px solid #26302c}
.balcard .big{font-size:40px;font-weight:700;letter-spacing:-1.4px;line-height:1;margin:4px 0 6px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chead h2{margin-bottom:0}
.nfcb{flex:0 0 48px;width:48px;height:48px;border-radius:16px;background:var(--accent);color:#0e1513;display:flex;align-items:center;justify-content:center}
.nfcb svg,.cact svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.nfcb.live{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
.cstrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -18px 0;padding:0 18px;scroll-padding:0 18px;scrollbar-width:none}
.cstrip::-webkit-scrollbar{display:none}
.ccard{flex:0 0 calc(100% - 52px);max-width:340px;box-sizing:border-box;height:164px;border-radius:24px;background:#1e2a26;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:center;opacity:.6;transition:opacity .2s}
.cstrip .ccard:only-child{flex-basis:100%;max-width:none}
.ccard.on{background:#0e1513;opacity:1}
html[data-theme="dark"] .ccard.on{background:#17201d;border:1px solid #26302c}
.ccard .ch{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:#a9b8b2}
.ccard .ch button{font-size:12px;color:#a9b8b2;padding:4px 9px;border-radius:9px;background:#ffffff14}
.ccard .cb{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1}
.ccard .cf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a9b8b2}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.cdots i{width:6px;height:6px;border-radius:3px;background:var(--edge);transition:width .2s}
.cdots i.on{width:18px;background:var(--ink)}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cact .btn{margin-top:0;height:48px;border-radius:16px;font-size:14px;gap:8px;background:var(--card)}
.cpill{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--okbg);color:var(--okink);font-size:13px;font-weight:600;text-align:center}
.cjs{padding:14px 16px 6px}
.cjh{display:flex;justify-content:space-between;align-items:baseline}
.cjh h4{margin:0;font-size:15px}
.cjh span{font-size:12px;color:var(--mut)}
.cjl{max-height:42vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.cjd{font-size:12px;font-weight:600;color:var(--mut);margin-top:12px;text-transform:uppercase;letter-spacing:.6px}
.jrow .t small.ok{color:var(--okink)}
.jrow b.g{font-size:17px}
.tlab{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin-top:14px}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.tcard{height:80px;border-radius:18px;background:var(--card2);color:var(--ink);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left}
.tcard span{font-size:12.5px;font-weight:600;color:var(--mut)}
.tcard b{font-size:21px}
.tcard.on{background:#0e1513;color:#fff}.tcard.on span{color:#a9b8b2}
.tchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tchips button{height:44px;border-radius:14px;background:var(--card2);font-weight:600;color:var(--ink)}
.tchips button.on{background:#0e1513;color:#fff}
.tsteps{background:var(--card2);border-radius:16px;padding:12px 14px;margin-top:14px;display:flex;flex-direction:column;gap:9px;font-size:13.5px}
.tsteps div{display:flex;gap:10px;align-items:center}
.tsteps i{font-style:normal;flex:0 0 22px;height:22px;border-radius:11px;background:#0e1513;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tsteps i.a{background:var(--accent);color:#0e1513}
.jrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.jrow:last-child{border-bottom:0}
.stc{padding:14px 14px 12px;margin-top:12px}
.sth{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sth h4{margin:0;font-size:17px}.sth span{font-size:12px;color:var(--mut)}
.stm{display:flex;align-items:center;gap:4px;font-size:13px;white-space:nowrap}
.stm button{width:30px;height:30px;border-radius:10px;border:0;background:var(--card2);color:var(--ink);font-size:17px}
.stm button[disabled]{opacity:.3}
.sts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sts div{background:var(--card2);border-radius:14px;padding:9px 11px}
.sts small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.sts b{font-size:17px}
.stc .dr{color:var(--red,#d0453a)}.stc .cr{color:var(--okink,#0b6b47)}
.stt{margin:12px -14px 0;border-top:1px solid var(--line)}
.stsc{max-height:46vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.stsc .str:last-child{border-bottom:0}
.str{display:grid;grid-template-columns:52px 1fr 68px 70px;gap:6px;padding:9px 14px;align-items:center;font-size:13px;border-bottom:1px solid var(--line)}
.str span:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
.str .d{color:var(--mut);font-size:12px}.str b{font-weight:600}.str small{display:block;color:var(--mut);font-size:11px}
.str .bl{font-weight:700}
.sthd{font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.4px;padding-top:7px;padding-bottom:7px}
.sto{font-weight:700;background:var(--card2)}.sto span:nth-child(2){color:var(--mut)}

.jrow .t{flex:1;min-width:0}
.jrow .t b{display:block;font-size:14.5px;font-weight:600}
.jrow .t small{display:block;color:var(--mut);font-size:12.5px}

/* ---------- fixed top, only the list scrolls ---------- */
body.fixed{overflow:hidden;padding-bottom:0}
body.fixed main#view{height:calc(100dvh - 92px - env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
.scr{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px 16px}
.scr>.day:first-child,.scr>.card:first-child,.scr>.ghead:first-child{margin-top:8px}
.scr .stsc{max-height:none!important;overflow:visible}
body.fixed #cardsV{flex:1;min-height:0;display:flex;flex-direction:column}
body.fixed .hero{gap:8px;padding:16px 18px}body.fixed .hero .big{font-size:38px}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
.fill .stt{flex:1;min-height:0;display:flex;flex-direction:column}
.fill .stsc{flex:1;min-height:0;max-height:none!important;overflow-y:auto}
/* ---------- blue & white ---------- */
html:not([data-theme="dark"]) .hero,.hero{background:linear-gradient(140deg,#1e5eff,#0b3bb8);border:0;box-shadow:0 12px 28px rgba(30,94,255,.25)}
html[data-theme="dark"] .hero{background:linear-gradient(140deg,#1a3a8f,#132a63)}
.pill,html:not([data-theme="dark"]) .pill{background:rgba(255,255,255,.18);color:#fff}
.spark div{background:rgba(255,255,255,.25)}.spark div.on{background:#fff}
.tabs .bar,html[data-theme="dark"] .tabs .bar{background:var(--card);border:1px solid var(--edge);box-shadow:0 8px 24px rgba(15,27,51,.12)}
.tabs button svg{stroke:var(--faint)}
.tabs button.on,html[data-theme="dark"] .tabs button.on{background:var(--soft)}
.tabs .plus svg{stroke:#fff}
.seg button.on,html[data-theme="dark"] .seg button.on{background:var(--accent);color:var(--accentink)}
.btn.pri,html[data-theme="dark"] .btn.pri{background:var(--accent);color:var(--accentink)}
.chips button.on,html[data-theme="dark"] .chips button.on{background:var(--accent);color:var(--accentink);border-color:var(--accent)}
.cats button.on,html[data-theme="dark"] .cats button.on{border-color:var(--accent)}
.fmt.on,.fmt.on .dot,html[data-theme="dark"] .fmt.on,html[data-theme="dark"] .fmt.on .dot{border-color:var(--accent)}
.fmt.on .dot i,html[data-theme="dark"] .fmt.on .dot i{background:var(--accent)}
.bars div,html[data-theme="dark"] .bars div{background:var(--soft)}.bars div.hi,html[data-theme="dark"] .bars div.hi{background:var(--accent)}
.ccard{background:#3d5f9e}.ccard.on,html[data-theme="dark"] .ccard.on{background:linear-gradient(140deg,#1e5eff,#0b3bb8);border:0}
.ccard .ch,.ccard .cf,.ccard .ch button{color:#d6e2ff}
.cdots i.on{background:var(--accent)}
.nfcb{color:#fff}.tcard.on,.tchips button.on{background:var(--accent);color:#fff}.tcard.on span{color:#d6e2ff}
.tsteps i{background:var(--ink)}.tsteps i.a{background:var(--accent);color:#fff}
.balcard,html[data-theme="dark"] .balcard{background:linear-gradient(140deg,#1e5eff,#0b3bb8);border:0}
.mbtn{border-color:var(--edge)}
.toast{background:#0f1b33}
.g{letter-spacing:-.3px}
/* home */
.pace{height:8px;background:rgba(255,255,255,.22);border-radius:4px;position:relative}
.pace i{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:4px}
.pace u{position:absolute;top:-4px;bottom:-4px;width:2px;background:#0b2a80;opacity:.7}
.pl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#d6e2ff}
.hchips{display:flex;gap:8px;overflow-x:auto;margin:14px -18px 0;padding:0 18px 2px;scrollbar-width:none}.hchips::-webkit-scrollbar{display:none}
.hchips button{flex:none;background:var(--card);border-radius:16px;padding:9px 12px;text-align:left;box-shadow:var(--shadow);font-size:12.5px;color:var(--mut)}
.hchips button b{display:block;font-size:15px;color:var(--ink);margin-top:1px}
.quick3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:12px}
.quick3 button{height:50px;border-radius:16px;font-weight:700;font-size:14.5px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px}
.quick3 button.a{background:var(--accent);color:#fff}
.warn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;margin-top:12px;background:#fff6e0;border:1px solid #ffe2a3;color:#8a5a00;border-radius:14px;padding:11px 13px;font-size:13.5px;font-weight:600}
html[data-theme="dark"] .warn{background:#2a2312;border-color:#4a3c14;color:#ffd98a}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;font-weight:800;font-size:16px;color:#fff}
.ntag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:#fff6e0;color:#8a5a00;margin-left:5px;vertical-align:2px}
html[data-theme="dark"] .ntag{background:#2a2312;color:#ffd98a}
.item .a small{display:block;font-size:11px;color:var(--mut);font-weight:500;text-align:right}
/* reports */
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpi div{background:var(--card2);border-radius:14px;padding:8px 10px}.kpi small{display:block;font-size:10.5px;color:var(--mut);font-weight:700;letter-spacing:.3px}.kpi b{font-size:15px}
.ins{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.ins:first-of-type{border-top:0}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--mut)}
.trend .b{width:100%;border-radius:7px 7px 3px 3px;background:var(--soft);min-height:3px}
.trend .cur .b{background:var(--accent)}.trend .cur{color:var(--ink);font-weight:700}
.trend .v{font-size:10px;color:var(--mut)}
.crow{display:block;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}.crow:first-of-type{border-top:0}
.crow .l{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}.crow .l b{font-weight:600}
.cbar{height:7px;background:var(--card2);border-radius:4px;margin-top:6px;overflow:hidden}.cbar i{display:block;height:100%;border-radius:4px}
.chg{font-size:11.5px;font-weight:700;margin-left:6px}.chg.up{color:var(--red)}.chg.dn{color:var(--okink)}
.split{display:flex;height:12px;border-radius:6px;overflow:hidden;margin-top:4px;background:var(--card2)}
.legs{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:9px;color:var(--mut)}.legs b{color:var(--ink)}.legs i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.wk{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:6px}
.wk>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10.5px;color:var(--mut)}
.wk .b{width:100%;border-radius:5px;background:var(--soft);min-height:3px}.wk .hi .b{background:#ffa726}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lnk{font-size:13px;font-weight:700;color:var(--accent)}
/* money */
.acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:12px 14px;margin-top:8px;box-shadow:var(--shadow)}
.acc .t{flex:1;min-width:0}.acc .t b{display:block;font-size:15px}.acc .t small{font-size:12px;color:var(--mut)}
.acc .v{font-size:17px;font-weight:700;text-align:right}.acc .v small{display:block;font-size:10.5px;font-weight:700;color:var(--red)}
.acc .ai{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mgrid button{height:48px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{padding:9px 12px;border-radius:12px;background:var(--card2);font-size:13px;font-weight:600;border:2px solid transparent}
.pick button.on{border-color:var(--accent);background:var(--soft)}
.lowbar{margin-top:10px;background:var(--redbg);color:var(--red);border-radius:12px;padding:9px 12px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs"><div class="bar" id="bar">
  <button data-t="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-t="reports" aria-label="Reports"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></button>
  <button data-t="card" aria-label="Travel card"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg></button>
  <button data-t="add" class="plus" aria-label="Add expense"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="money" aria-label="Money"><svg viewBox="0 0 24 24"><path d="M3 7h15a3 3 0 0 1 3 3v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-4 2 4"/><circle cx="16.5" cy="14" r="1.5"/></svg></button>
  <button data-t="more" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div></nav>
<div id="ov" class="ov hidden"><div class="sheet" id="sheet"></div></div>

<script>
const VERSION='6.0';
const APP=window.KharchaApp||null;
const POOLDRIVE='io.github.dhbhojani12.pooldrive';

/* ---------- categories ---------- */
const ICONS={
 food:['<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 0-3 2-3 6s1 4 3 4"/>','#ffe8d6','#b4540a','#3a2616','#ffb27a','#f08a3c'],
 groc:['<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.5 12h11L21 7H6"/>','#e3f5d8','#3f7a12','#1c2e14','#a5db7c','#6dbf3a'],
 travel:['<path d="M4 13l2-6h12l2 6v4H4zM6 17v2M18 17v2M4 13h16"/>','#dcebff','#1d5fbf','#18283f','#8db8ff','#4a8cf0'],
 shop:['<path d="M6 7h12l1 14H5zM9 7a3 3 0 0 1 6 0"/>','#fde2f0','#a3246a','#3a1428','#f59ec6','#e05c9c'],
 bills:['<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>','#fff4cc','#8a6500','#352a08','#e8c45c','#d8a52a'],
 study:['<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-2 1"/>','#e8e4ff','#5b44c9','#241d45','#b2a4ff','#7c63e8'],
 health:['<path d="M9 6h6v3h3v6h-3v3H9v-3H6V9h3z"/>','#ffe3e3','#b4321f','#3a1715','#ff9a8c','#e8614a'],
 fun:['<path d="M4 5h16v14H4zM4 9h16M8 5v4M16 5v4M9 13l5 3-5 3z"/>','#e6e9ff','#3b47b8','#1b2047','#9aa6ff','#5d6ae0'],
 friends:['<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M21 20c0-2-1.5-4-4-4.6"/>','#e0f2ef','#0f6b5e','#14302a','#6fd9c4','#2bb39b'],
 home:['<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>','#efe9e2','#6b5540','#2c241c','#d5bfa6','#a3835f'],
 gift:['<path d="M3 9h18v4H3zM5 13h14v8H5zM12 9v12M12 9c-3 0-5-1-5-3s3-2 5 3c2-5 5-5 5-3s-2 3-5 3z"/>','#ffe1ea','#b32a52','#3a1521','#f58fab','#e2577f'],
 other:['<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>','#eceef0','#4b5563','#232a2f','#aeb8c2','#6b7785']};
const PALETTE=['#f08a3c','#6dbf3a','#4a8cf0','#e05c9c','#d8a52a','#7c63e8','#e8614a','#5d6ae0','#2bb39b','#a3835f','#e2577f','#6b7785'];
const EMO={food:'🍔',groc:'🛒',travel:'🚕',shop:'🛍️',bills:'💡',study:'📚',health:'💊',fun:'🎬',friends:'🤝',home:'🏠',gift:'🎁',other:'📦'};
const DEF_CATS=[['food','Food'],['groc','Groceries'],['travel','Travel'],['shop','Shopping'],['bills','Bills'],['study','Study'],['health','Health'],['fun','Fun'],['friends','Friends'],['home','Home'],['gift','Gifts'],['other','Other']].map(([id,name])=>({id,name,emoji:EMO[id]}));
const MODES=['UPI','Cash','Card','Bank'];

/* ---------- data ---------- */
const LS='kharcha.v1';
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS));
    if(s&&Array.isArray(s.expenses)){
      s.cats=(s.cats&&s.cats.length?s.cats:DEF_CATS.slice()).map(c=>({id:c.id,name:c.name,emoji:c.emoji||EMO[c.id]||'🏷️'}));
      s.rules=s.rules||{};s.seen=s.seen||{};s.theme=s.theme||'system';
      if(s.themeV!==2){s.theme='light';s.themeV=2}
      s.names=s.names||{};s.accounts=s.accounts||[];s.moves=s.moves||[];s.lowSent=s.lowSent||{};
      s.expenses=s.expenses.filter(e=>e&&e.status!=='pending').map(e=>{const{att,...r}=e;return r});
      return s}}catch(e){}
  return{v:2,expenses:[],cats:DEF_CATS.slice(),rules:{},seen:{},theme:'light',themeV:2,names:{},accounts:[],moves:[],lowSent:{}};
}
function save(){try{lowCheck()}catch(e){}try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save – storage full?')}syncNative()}
/* today / this month totals for the home-screen widget */
function syncTotals(){if(!(APP&&APP.setTotals))return;try{const n=new Date();const d0=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();const m0=new Date(n.getFullYear(),n.getMonth(),1).getTime();
  let t=0,m=0;S.expenses.forEach(e=>{if(e.ts>=m0){m+=e.amt;if(e.ts>=d0)t+=e.amt}});
  APP.setTotals(JSON.stringify({dayStart:d0,monthStart:m0,today:Math.round(t*100)/100,month:Math.round(m*100)/100}))}catch(e){}}
function syncNative(){syncTotals();if(APP&&APP.setCats){try{APP.setCats(JSON.stringify(S.cats.map(c=>({id:c.id,name:c.name,emoji:c.emoji||EMO[c.id]||'🏷️'}))));APP.setRules(JSON.stringify(S.rules))}catch(e){}}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const view=$('#view');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==='other')||{id:'other',name:'Other',emoji:'📦'};
const key=s=>(s||'').toLowerCase().replace(/[^a-z0-9@.]/g,'');
const ym=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const monthName=m=>{const[y,mm]=m.split('-');return MN[+mm-1]+' '+y};
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()};
const sameDay=(a,b)=>sod(a)===sod(b);
const sum=a=>a.reduce((s,e)=>s+e.amt,0);
const tm=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
function dayLabel(t){const n=Date.now();if(sameDay(t,n))return'Today';if(sameDay(t,n-864e5))return'Yesterday';const d=new Date(t);return d.getDate()+' '+MN[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function dtLocal(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
const dmy=t=>{const d=new Date(t);return d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear()};
const iso=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Needs internet the first time'));document.head.appendChild(s)})}
const loadXLSX=()=>window.XLSX?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
const darkOn=()=>S.theme==='dark'||(S.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){const d=darkOn();document.documentElement.dataset.theme=d?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0b1220':'#f3f6fc'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()})}catch(e){}
function icoHtml(id){const i=ICONS[id]||ICONS.other;const d=darkOn();
  return `<span class="ico" style="background:${d?i[3]:i[1]}"><svg viewBox="0 0 24 24" stroke="${d?i[4]:i[2]}">${i[0]}</svg></span>`}
const catColor=(id,n)=>(ICONS[id]?ICONS[id][5]:null)||PALETTE[n%PALETTE.length];

const KW=[[/swiggy|zomato|domino|mcdonald|kfc|pizza|cafe|restaurant|hotel|food|bakery|chai|tea|canteen|burger|starbucks/i,'food'],
[/blinkit|zepto|bigbasket|dmart|instamart|grocer|kirana|supermarket|jiomart|milk|dairy/i,'groc'],
[/uber|ola|rapido|irctc|metro|railway|petrol|fuel|indianoil|iocl|hpcl|bpcl|fastag|redbus|makemytrip|indigo|parking/i,'travel'],
[/amazon|flipkart|myntra|ajio|meesho|nykaa|croma|decathlon/i,'shop'],
[/airtel|jio|vodafone|\bvi\b|bsnl|electric|power|recharge|broadband|gas|bill|dth/i,'bills'],
[/icai|book|udemy|course|coaching|xerox|stationery|exam/i,'study'],
[/apollo|pharm|medplus|hospital|clinic|1mg|netmeds|chemist|medical/i,'health'],
[/netflix|spotify|hotstar|bookmyshow|prime|pvr|inox|youtube/i,'fun']];
const guessCat=s=>{for(const[r,c]of KW)if(r.test(s||''))return S.cats.some(x=>x.id===c)?c:'';return''};
const suggest=(payee,extra)=>S.rules[key(payee)]||guessCat([payee,extra].join(' '));
function learn(payee,c){if(payee&&c)S.rules[key(payee)]=c}
const catGrid=(sel,id)=>`<div class="cats" id="${id}">${S.cats.map(c=>`<button type="button" data-c="${c.id}" class="${c.id===sel?'on':''}">${icoHtml(c.id)}${esc(c.name)}</button>`).join('')}</div>`;
function bindPick(el,attr,cb){el.addEventListener('click',ev=>{const b=ev.target.closest(`button[${attr}]`);if(!b)return;el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');el.classList.remove('err');cb&&cb(b.getAttribute(attr))})}
const picked=(el,attr)=>{const b=el.querySelector('button.on');return b?b.getAttribute(attr):''};
const segHtml=(id,opts,sel)=>`<div class="seg" id="${id}" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(o=>`<button type="button" data-m="${esc(o)}" class="${o===sel?'on':''}">${esc(o)}</button>`).join('')}</div>`;

/* ---------- sheet ---------- */
function openSheet(html,mount){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#ov').classList.remove('hidden');mount&&mount($('#sheet'))}
function closeSheet(){$('#ov').classList.add('hidden');$('#sheet').innerHTML='';if(Q.length)setTimeout(nextQueued,300)}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

/* ---------- add / edit ---------- */
/* one-tap note buttons: meals for Food, ride type for Travel */
const QUICK={food:[['🌅','Breakfast'],['☀️','Lunch'],['🍪','Snacks'],['🌙','Dinner']],travel:[['🛺','Auto'],['🚌','Bus'],['🚕','Cab'],['🚆','Train']]};
const quickBtns=(c,note)=>(QUICK[c]||[]).map(([i,w])=>`<button type="button" data-meal="${w}" class="${(note||'').trim().toLowerCase()===w.toLowerCase()?'on':''}">${i} ${w}</button>`).join('');
function addSheet(e){
  const x=Object.assign({amt:'',cat:'',mode:'UPI',payee:'',note:'',ts:Date.now()},e||{});
  openSheet(`<h3>${x.id?'Edit expense':'Add expense'}</h3>
  <div class="amt"><span>₹</span><input id="fAmt" inputmode="decimal" placeholder="0" value="${x.amt||''}" aria-label="Amount"></div>
  <div class="small muted" style="text-align:center">${esc(dayLabel(x.ts))} · ${esc(tm(x.ts))}</div>
  <div style="margin-top:14px">${segHtml('fMode',MODES,x.mode)}</div>
  ${S.accounts.length?`<div class="lab">Paid from</div><div class="pick" id="fAcc">${S.accounts.map(a=>`<button type="button" data-a="${a.id}" class="${a.id===(x.acc&&accById(x.acc)?x.acc:accOf(x))?'on':''}">${a.type==='cash'?'💵':'🏦'} ${esc(accLabel(a))}</button>`).join('')}</div>`:''}
  <div class="lab">Category</div>
  ${catGrid(x.cat,'fCats')}
  <div class="chips" id="fMeal" style="margin-top:10px">${quickBtns(x.cat,x.note)}</div>
  <div class="lab">Details</div>
  <input id="fPayee" placeholder="Paid to" value="${esc(x.payee)}" style="margin-bottom:8px">
  ${x.id&&isUpi(x.payee)?`<button type="button" class="lnk" id="fName" style="margin:0 2px 10px">${S.names[key(x.payee)]?'Rename this payee ('+esc(S.names[key(x.payee)])+')':'Optional: name this payee (for shops you pay often)'} ›</button>`:''}

/* ---------- reports ---------- */
const RP={p:'month',anchor:Date.now(),cat:null};
/** [start,end) of the period containing t, and of the period n steps away */
function periodRange(p,t,n){
  const d=new Date(t);
  if(p==='week'){const s=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)+7*(n||0));return[s.getTime(),new Date(s.getFullYear(),s.getMonth(),s.getDate()+7).getTime()]}
  if(p==='year'){const y=d.getFullYear()+(n||0);return[new Date(y,0,1).getTime(),new Date(y+1,0,1).getTime()]}
  const s=new Date(d.getFullYear(),d.getMonth()+(n||0),1);return[s.getTime(),new Date(s.getFullYear(),s.getMonth()+1,1).getTime()];
}
function periodName(p,a){const d=new Date(a);
  if(p==='week'){const e=new Date(a+6*864e5);return d.getDate()+' '+MN[d.getMonth()]+' – '+e.getDate()+' '+MN[e.getMonth()]}
  if(p==='year')return String(d.getFullYear());return MN[d.getMonth()]+' '+d.getFullYear()}
const prevWord=p=>({week:'last week',month:'last month',year:'last year'})[p];
const inPer=(arr,a,b)=>arr.filter(e=>e.ts>=a&&e.ts<b);
const pct=(a,b)=>b?Math.round((a-b)/b*100):null;
const chgHtml=c=>c===null?'':`<span class="chg ${c>0?'up':'dn'}">${c>0?'↑':'↓'}${Math.abs(c)}%</span>`;
const byCat=arr=>{const o={};arr.forEach(e=>o[e.cat]=(o[e.cat]||0)+e.amt);return o};
function payKey(e){const nm=nameOf(e);return isTrip(e)?(e.payee||'Metro card'):nm.n}

function vReports(){
  const[a,b]=periodRange(RP.p,RP.anchor,0),[pa,pb]=periodRange(RP.p,RP.anchor,-1);
  const now=Date.now(),isCur=now>=a&&now<b;
  const all=inPer(S.expenses,a,b),prevAll=inPer(S.expenses,pa,pb);
  const ex=RP.cat?all.filter(e=>e.cat===RP.cat):all,prev=RP.cat?prevAll.filter(e=>e.cat===RP.cat):prevAll;
  const tot=sum(ex),ptot=sum(prev),ch=pct(tot,ptot);
  const days=Math.max(1,Math.ceil(((isCur?now:b)-a)/864e5)),perDay=tot/days;
  const fullDays=Math.round((b-a)/864e5),proj=isCur?perDay*fullDays:null;
  const c0=RP.cat?cat(RP.cat):null;
  // trend: last 6 periods (a year shows its 12 months)
  let tr=[];
  if(RP.p==='year'){const y=new Date(a).getFullYear();for(let i=0;i<12;i++){const s=new Date(y,i,1).getTime(),e=new Date(y,i+1,1).getTime();tr.push({l:MN[i].charAt(0),v:sum(inPer(S.expenses,s,e).filter(x=>!RP.cat||x.cat===RP.cat)),cur:now>=s&&now<e})}}
  else for(let i=-5;i<=0;i++){const[s,e]=periodRange(RP.p,RP.anchor,i);const d=new Date(s);tr.push({l:RP.p==='week'?d.getDate()+' '+MN[d.getMonth()]:MN[d.getMonth()],v:sum(inPer(S.expenses,s,e).filter(x=>!RP.cat||x.cat===RP.cat)),cur:i===0})}
  const tmx=Math.max(...tr.map(t=>t.v),1);
  // categories with change
  const bc=byCat(ex),pc=byCat(prev);const cs=Object.entries(bc).sort((x,y)=>y[1]-x[1]);const cmx=cs.length?cs[0][1]:1;

/* ---------- money: cash & bank accounts ---------- */
/* An account starts from the balance entered when it was added (open, openTs).
   Its balance = open − expenses paid from it + money in/transfers since then.
   Old expenses without an account are matched by how they were paid:
   Cash → the cash account, UPI/Bank → the default bank. Metro card fares use no account. */
const accById=id=>S.accounts.find(a=>a.id===id);
const cashAcc=()=>S.accounts.find(a=>a.type==='cash');
const defBank=()=>S.accounts.find(a=>a.type==='bank'&&a.def)||S.accounts.find(a=>a.type==='bank');
const accLabel=a=>a?(a.type==='cash'?a.name||'Cash':a.name+(a.last4?' ··'+a.last4:'')):'';
function accOf(e){
  if(e.acc&&accById(e.acc))return e.acc;
  if(isTrip(e)||e.mode==='Card')return null;
  const a=e.mode==='Cash'?cashAcc():defBank();return a?a.id:null}
function accName(e){if(!S.accounts.length)return'';const a=accById(accOf(e));return a?(a.type==='cash'?'Cash':a.name):''}
function moveText(m,side){
  const f=accById(m.from),t=accById(m.to);
  if(m.kind==='fix')return['Balance corrected','to match your bank / wallet'];
  if(m.kind==='in')return[m.note||'Money in','Received'];
  if(m.kind==='atm')return side==='out'?['ATM → '+accLabel(t||{name:'Cash',type:'cash'}),'Transfer']:['ATM withdrawal',f?'from '+accLabel(f):'Transfer'];
  if(m.kind==='card')return[(m.note||'Travel card')+' top-up','Transfer'];
  return side==='out'?['To '+accLabel(t),'Transfer'+(m.note?' · '+m.note:'')]:['From '+accLabel(f),'Transfer'+(m.note?' · '+m.note:'')];
}
function accEvents(a){
  const ev=[];
  S.expenses.forEach(e=>{if(e.ts>=a.openTs&&accOf(e)===a.id){const nm=nameOf(e);ev.push({ts:e.ts,amt:-e.amt,what:nm.n,sub:cat(e.cat).name+' · '+e.mode,eid:e.id})}});
  S.moves.forEach(m=>{if(m.ts<a.openTs)return;
    if(m.to===a.id){const[w,sb]=moveText(m,'in');ev.push({ts:m.ts,amt:m.amt,what:w,sub:sb,mid:m.id})}
    if(m.from===a.id){const[w,sb]=moveText(m,'out');ev.push({ts:m.ts,amt:-m.amt,what:w,sub:sb,mid:m.id})}});
  ev.sort((x,y)=>x.ts-y.ts);let b=a.open;ev.forEach(r=>{b=Math.round((b+r.amt)*100)/100;r.bal=b});
  return ev;
}
const accBal=a=>{const ev=accEvents(a);return ev.length?ev[ev.length-1].bal:a.open};
/** low-balance reminders: once when an account drops below its limit, again only after it recovers */
function lowCheck(){
  if(!S.accounts)return;
  S.accounts.forEach(a=>{if(!(a.low>0))return;const b=accBal(a);
    if(b<a.low&&!S.lowSent[a.id]){S.lowSent[a.id]=Date.now();
      const t=accLabel(a)+' is low: '+inr(b),m='Below your '+inr(a.low)+' reminder.';
      try{if(APP&&APP.notify)APP.notify(t,m);else setTimeout(()=>toast('⚠ '+t),400)}catch(e){}}
    else if(b>=a.low&&S.lowSent[a.id])delete S.lowSent[a.id]});
}

/* ---------- travel card (NFC) ---------- */
/* Each card is kept on its own, keyed by its number. Spending between taps is
   worked out as: previous balance + top-ups recorded since then - balance now. */
const CARDK='kharcha.cards';
let cardsBusy=false,cardErr=null,selCard=null;
function loadCards(){try{const c=JSON.parse(localStorage.getItem(CARDK));if(c&&c.list)return c}catch(e){}
  // carry over a card saved by the first version
  try{const o=JSON.parse(localStorage.getItem('kharcha.card'));
    if(o&&o.balance!=null){const id=o.pan||'card';return{list:{[id]:{...o,id,topups:[]}}}}}catch(e){}
  return{list:{}}}
function saveCards(c){try{localStorage.setItem(CARDK,JSON.stringify(c))}catch(e){}syncCardsNative(c)}
/* home-screen widget shows the last read balance of each card */
function syncCardsNative(c){if(!(APP&&APP.setCards))return;try{c=c||loadCards();
  const l=Object.values(c.list).sort((a,b)=>String(a.id).localeCompare(String(b.id))).map(x=>({name:cardName(x),last4:String(x.pan||'').slice(-4),balance:x.balance!=null?x.balance:null,readAt:x.readAt||0}));
  APP.setCards(JSON.stringify(l))}catch(e){}}
const cardList=()=>Object.values(loadCards().list).sort((a,b)=>(b.readAt||0)-(a.readAt||0));
const jkey=j=>j.v===2?'v2-'+j.seq+'-'+j.ts:[j.seq,j.mins,j.term,j.op].join('-');
const realJourneys=c=>(c.journeys||[]).filter(j=>j.v===2); // older builds misread the log; ignore those
const cardName=c=>c.name||c.cardType||'Travel card';

/* ---------- card statement ---------- */
/* The chip keeps only its last few taps, so Kharcha keeps every fare it has seen (hist)
   and every balance it has read (snaps). The statement is rebuilt from those. */
const maxSeq=js=>(js||[]).reduce((m,j)=>j.v===2&&j.seq>m?j.seq:m,-1);
function addHist(h,js){(js||[]).filter(j=>j.v===2).forEach(j=>{h[jkey(j)]={amt:j.amt,ts:j.ts,seq:j.seq}})}
function addSnap(sn,ts,bal,seq){if(bal==null)return;const l=sn[sn.length-1];
  if(l&&seq<l.seq)seq=l.seq; // the counter only goes up; a read that lists older/no entries keeps the last one
  if(l&&l.bal===bal&&l.seq===seq){l.ts=ts;return}sn.push({ts,bal,seq});if(sn.length>600)sn.splice(0,sn.length-600)}
function keepHistory(prev,c){
  const h={...(prev.hist||{})};const sn=(prev.snaps||[]).slice();
  if(!prev.snaps&&prev.balance!=null){addHist(h,prev.journeys);addSnap(sn,prev.readAt||c.readAt,prev.balance,maxSeq(prev.journeys))}
  addHist(h,c.journeys);addSnap(sn,c.readAt,c.balance,maxSeq(c.journeys));
  c.hist=h;c.snaps=sn;
}
/** every fare / top-up with the balance after it */
function ledger(c){
  let snaps=(c.snaps||[]).slice();
  if(!snaps.length&&c.balance!=null)snaps=[{ts:c.readAt||Date.now(),bal:c.balance,seq:maxSeq(c.journeys)}];
  if(!snaps.length)return null;
  snaps.sort((a,b)=>a.ts-b.ts);
  for(let i=1;i<snaps.length;i++)if(snaps[i].seq<0)snaps[i]={...snaps[i],seq:snaps[i-1].seq};
  const h={...(c.hist||{})};addHist(h,c.journeys);
  const fares=Object.entries(h).map(([k,v])=>({k,...v})).filter(f=>f.amt>0).sort((a,b)=>a.seq-b.seq);
  const tops=(c.topups||[]).slice().sort((a,b)=>a.ts-b.ts);
  const known=c.known||{};
  const fRow=f=>({ts:f.ts,amt:-f.amt,what:'Fare',sub:known[f.k]?'logged ✓':'not logged yet'});
  const tRow=t=>({ts:t.ts,amt:t.amt,what:'Top-up',sub:'recorded by you'});
  const rows=[];
  // fares the chip still had before Kharcha's first read
  const s0=snaps[0];const pre=fares.filter(f=>f.seq<=s0.seq);
  const preT=pre.length?tops.filter(t=>t.ts>=pre[0].ts&&t.ts<=s0.ts):[];
  pre.forEach(f=>rows.push({...fRow(f),iv:-1}));preT.forEach(t=>rows.push({...tRow(t),iv:-1}));
  const open=Math.round((s0.bal+pre.reduce((x,f)=>x+f.amt,0)-preT.reduce((x,t)=>x+t.amt,0))*100)/100;
  const openTs=pre.length?pre[0].ts:s0.ts;
  // Each fare is placed once, in the first card read where the balance had gone down enough to
  // include it (a fare can be seen on the chip a read or two after it happened). Whatever drop
  // is left over is "not itemised"; a rise with no recorded top-up is an unrecorded top-up.
  const q=fares.filter(f=>f.seq>s0.seq);let qi=0;
  const day0=t=>{const d=new Date(t);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
  for(let i=0;i+1<snaps.length;i++){
    const a=snaps[i],b=snaps[i+1];
    const T=tops.filter(t=>t.ts>a.ts&&t.ts<=b.ts),topSum=T.reduce((x,t)=>x+t.amt,0);
    const drop=Math.round((a.bal+topSum-b.bal)*100)/100;
    const F=[];
    if(drop>0.005){let left=drop;
      while(qi<q.length&&q[qi].ts<=b.ts&&q[qi].amt<=left+0.005){F.push(q[qi]);left-=q[qi].amt;qi++}}
    else if(drop<-0.005){
      while(qi<q.length&&q[qi].ts<=b.ts&&q[qi].ts>=day0(a.ts)){F.push(q[qi]);qi++}}
    const ev=[...F.map(fRow),...T.map(tRow)].sort((x,y)=>x.ts-y.ts);ev.forEach(e=>e.iv=i);
    const fSum=F.reduce((x,f)=>x+f.amt,0);
    const rest=Math.round((drop-fSum)*100)/100;
    if(rest>0.005)ev.push({ts:b.ts,amt:-rest,what:'Fares (not itemised)',sub:'trips the chip didn\'t list',unit:true,iv:i});
    else if(rest<-0.005)ev.push({ts:b.ts,amt:-rest,what:'Top-up',sub:'not recorded in Kharcha',iv:i});
    rows.push(...ev);
  }
  rows.sort((x,y)=>x.ts-y.ts);
  let bal=open;rows.forEach(r=>{bal=Math.round((bal+r.amt)*100)/100;r.bal=bal});
  const lastIv=snaps.length-2;
  const lastSpent=Math.round(-rows.filter(x=>x.iv===lastIv&&x.amt<0).reduce((s2,x)=>s2+x.amt,0)*100)/100;
  return{open,openTs,rows,start:ym(openTs),lastSpent,lastTs:snaps[snaps.length-1].ts};
}
/** travel spend the card shows but that isn't in expenses yet: the 'not itemised' gaps (single fares have their own button) */
function unloggedTravel(c){
  const L=ledger(c);if(!L)return{amt:0,upTo:0,L:null};
  let since=c.unitLoggedTs;
  if(since==null){since=0;S.expenses.forEach(e=>{if(e.src==='nfc'&&e.payee===cardName(c)&&/^Card (spend|fares)/.test(e.note||'')&&e.ts>since)since=e.ts})}
  const rs=L.rows.filter(x=>x.unit&&x.ts>since);
  return{amt:Math.round(-rs.reduce((s2,x)=>s2+x.amt,0)*100)/100,upTo:rs.length?Math.max(...rs.map(x=>x.ts)):since,L};
}
let stMonth=null;
function statementFor(c,m){
  const L=ledger(c);if(!L)return null;
  const [y,mm]=m.split('-').map(Number);const m0=new Date(y,mm-1,1).getTime(),m1=new Date(y,mm,1).getTime();
  const before=L.rows.filter(r=>r.ts<m0),inM=L.rows.filter(r=>r.ts>=m0&&r.ts<m1);
  const opening=before.length?before[before.length-1].bal:L.open;
  const openTs=before.length||L.openTs<m0?m0:L.openTs;
  const closing=inM.length?inM[inM.length-1].bal:opening;
  const fares=Math.abs(inM.filter(r=>r.amt<0).reduce((x,r)=>x+r.amt,0)),tops=inM.filter(r=>r.amt>0).reduce((x,r)=>x+r.amt,0);
  return{L,m,rows:inM,opening,openTs,closing,closeTs:inM.length?inM[inM.length-1].ts:openTs,fares,tops};
}
const n2=v=>(Math.round(v*100)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const dmon=ts=>new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
function statementHtml(c){
  const cur=ym(Date.now());const L=ledger(c);if(!L)return'';
  if(!stMonth||stMonth>cur||stMonth<L.start)stMonth=cur;
  const S2=statementFor(c,stMonth);

  const canP=prevM>=L.start,canN=nextM<=cur;
  const row=r=>`<div class="str"><span class="d">${esc(dmon(r.ts))}</span><span><b>${esc(r.what)}</b><small>${esc(r.sub)}</small></span><span class="${r.amt<0?'dr':'cr'}">${r.amt<0?'−':'+'}${n2(Math.abs(r.amt))}</span><span class="bl">${n2(r.bal)}</span></div>`;
  return `<div class="card stc">
    <div class="sth"><div><h4>Statement</h4><span>${esc(cardName(c))}${c.pan?' · ···· '+esc(c.pan.slice(-4)):''}</span></div>
      <div class="stm"><button data-stm="${prevM}"${canP?'':' disabled'} aria-label="Previous month">‹</button><b>${esc(new Date(y,mm-1,1).toLocaleDateString('en-IN',{month:'short',year:'numeric'}))}</b><button data-stm="${nextM}"${canN?'':' disabled'} aria-label="Next month">›</button></div></div>
    <div class="sts"><div><small>OPENING · ${esc(dmon(S2.openTs)).toUpperCase()}</small><b>${inr(S2.opening)}</b></div><div><small>CLOSING${stMonth===cur?' · NOW':''}</small><b>${inr(S2.closing)}</b></div>
      <div><small>FARES</small><b class="dr">− ${inr(S2.fares)}</b></div><div><small>TOP-UPS</small><b class="cr">+ ${inr(S2.tops)}</b></div></div>
    <div class="stt"><div class="str sthd"><span>DATE</span><span>DETAILS</span><span>AMOUNT</span><span>BALANCE</span></div>
      <div class="stsc" id="stsc"><div class="str sto"><span>${esc(dmon(S2.openTs))}</span><span>Opening balance</span><span></span><span class="bl">${n2(S2.opening)}</span></div>
      ${S2.rows.map(row).join('')||'<div class="str"><span></span><span class="muted">No fares or top-ups this month</span><span></span><span></span></div>'}
      <div class="str sto"><span>${esc(dmon(S2.closeTs))}</span><span>Closing balance</span><span></span><span class="bl">${n2(S2.closing)}</span></div></div></div>
    <div class="cact"><button class="btn" data-stpdf="${esc(c.id)}">Download PDF</button><button class="btn" data-stshare="${esc(c.id)}">Share</button></div>
    <div class="small muted" style="text-align:center;margin-top:10px">Built from every tap Kharcha has seen. The chip only remembers its last 3 taps, so tap your card every day or two to keep each fare listed.</div>
  </div>`;
}
function statementDoc(c){

  const [y,mm]=S2.m.split('-').map(Number);const mon=new Date(y,mm-1,1).toLocaleDateString('en-IN',{month:'long',year:'numeric'});

/** spent since the previous tap, allowing for top-ups the user recorded */
function spendInfo(c){
  if(c.prevBalance==null||c.balance==null)return null;
  const tops=(c.topups||[]).filter(t=>t.ts>(c.prevReadAt||0)&&t.ts<=(c.readAt||Date.now()));
  const topped=tops.reduce((s,t)=>s+t.amt,0);
  const spent=Math.round((c.prevBalance+topped-c.balance)*100)/100;
  return{spent,topped,unexplained:spent<-0.005};
}

window.kharchaCard=function(res){
  cardsBusy=false;
  if(!res||res.error){cardErr=(res&&res.error)||'Could not read the card';render();return}
  cardErr=null;
  const id=storeCardRead(res);if(!id)return;selCard=id;
  if(APP&&APP.stopCard)try{APP.stopCard()}catch(e){}
  render();
};
/* save one card read (from the Card tab, or from tapping the card while Kharcha was closed) */
function storeCardRead(res){
  if(!res||res.error)return null;
  const store=loadCards();
  const id=res.pan||res.aid||'card';
  const prev=store.list[id]||{};
  if(Array.isArray(res.journeys)){const seen={};res.journeys=res.journeys.filter(j=>{const k=jkey(j);if(seen[k])return false;seen[k]=1;return true}).sort((a,b)=>((b.ts||0)-(a.ts||0))||((b.seq||0)-(a.seq||0)))}
  const c={...prev,...res,id,language:undefined,
    name:prev.name,
    topups:prev.topups||[],
    known:prev.known||{},
    bg:!!res.bg,
    readAt:res.readAt||Date.now(),
    prevBalance:(prev.balance!=null?prev.balance:null),
    prevReadAt:(prev.readAt||null)};
  if(prev.readAt&&c.readAt<prev.readAt)return id; // an older read than what we have
  keepHistory(prev,c);
  // several taps while Kharcha was closed: keep counting spend from the first of them
  if(res.bg&&prev.bg&&prev.prevBalance!=null){c.prevBalance=prev.prevBalance;c.prevReadAt=prev.prevReadAt}
  store.list[id]=c;saveCards(store);
  return id;
}

function importJourneys(id){

const X={range:'month',cats:'all',fmt:'xlsx',from:null,to:null};
function rangeBounds(){
  const now=Date.now();const[y,mm]=ym(now).split('-').map(Number);
  if(X.range==='month')return[new Date(y,mm-1,1).getTime(),now];
  if(X.range==='last')return[new Date(y,mm-2,1).getTime(),new Date(y,mm-1,1).getTime()-1];
  if(X.range==='all')return[0,now];
  return[X.from!=null?X.from:new Date(y,mm-1,1).getTime(),(X.to!=null?X.to:now)+864e5-1];
}
function exportSet(){const b=rangeBounds();
  return S.expenses.filter(e=>e.ts>=b[0]&&e.ts<=b[1]&&(X.cats==='all'||X.cats===e.cat)).sort((p,q)=>p.ts-q.ts)}
function vExport(){
  const list=exportSet();const b=rangeBounds();const lo=b[0],hi=Math.min(b[1],Date.now());
  const fmtRow=(id,name,desc,tag,bg,fg)=>`<button class="fmt ${X.fmt===id?'on':''}" data-f="${id}"><span class="tag" style="background:${bg};color:${fg}">${tag}</span><span class="t"><b>${name}</b><small>${desc}</small></span><span class="dot"><i></i></span></button>`;
  view.innerHTML=`<h2 class="g">Export</h2>
  <div class="small muted" style="margin:-8px 2px 0">Download your expenses as a file</div>
  <div class="lab">Date range</div>
  ${segHtml('xRange',['This month','Last month','Custom','All'],{month:'This month',last:'Last month',custom:'Custom',all:'All'}[X.range])}
  ${X.range==='custom'?`<div class="row" style="margin-top:8px"><input type="date" id="xFrom" value="${iso(lo)}" aria-label="From"><input type="date" id="xTo" value="${iso(hi)}" aria-label="To"></div>`:`<div class="small muted" style="margin:8px 2px 0">${X.range==='all'?'Everything':esc(dmy(lo))+' – '+esc(dmy(hi))}</div>`}
  <div class="lab">Categories</div>
  <div class="chips" id="xCats"><button type="button" data-c="all" class="${X.cats==='all'?'on':''}">All</button>${S.cats.map(c=>`<button type="button" data-c="${c.id}" class="${X.cats===c.id?'on':''}">${c.emoji||''} ${esc(c.name)}</button>`).join('')}</div>
  <div class="lab">Format</div>
  <div id="xFmt">
    ${fmtRow('xlsx','Excel','Expenses + monthly summary sheet','XLS','#ddf3e6','#1e7a45')}
    ${fmtRow('pdf','PDF report','Totals, chart and list – ready to print','PDF','#fde3e1','#b4321f')}
    ${fmtRow('csv','CSV','Plain table for any app','CSV','#e6ecf5','#2d4f86')}
  </div>
  <div class="small muted" style="text-align:center;margin-top:16px">${list.length} expense${list.length===1?'':'s'} · ${inr(sum(list))}</div>
  <button class="btn pri" id="xGo" style="margin-top:8px">${list.length?'Export '+({xlsx:'Excel',pdf:'PDF',csv:'CSV'})[X.fmt]:'Nothing to export'}</button>
  <div class="small muted" style="text-align:center;margin-top:8px">${APP?'Saved to Downloads':'Downloads to this device'}</div>`;
  bindPick($('#xRange'),'data-m',v=>{X.range={'This month':'month','Last month':'last','Custom':'custom','All':'all'}[v];render()});
  bindPick($('#xCats'),'data-c',v=>{X.cats=v;render()});
  $('#xFmt').addEventListener('click',ev=>{const t=ev.target.closest('[data-f]');if(!t)return;X.fmt=t.dataset.f;render()});
  const f=$('#xFrom'),t=$('#xTo');
  if(f)f.onchange=()=>{X.from=new Date(f.value+'T00:00').getTime();render()};
  if(t)t.onchange=()=>{X.to=new Date(t.value+'T00:00').getTime();render()};
  $('#xGo').onclick=()=>{if(!list.length)return toast('Nothing to export');
    const name='Kharcha-'+(X.range==='all'?'all':iso(lo)+'_'+iso(hi));
    if(X.fmt==='xlsx')exportXlsx(list,name);else if(X.fmt==='csv')exportCsv(list,name);else exportPdf(list,name)};
}
const rowsOf=list=>list.map(e=>({Date:new Date(e.ts).toLocaleDateString('en-IN'),Time:tm(e.ts),Amount:e.amt,Category:cat(e.cat).name,'Paid to':e.payee||'',Mode:e.mode,Note:e.note||''}));
const b64of=s=>btoa(unescape(encodeURIComponent(s)));
function deliver(name,b64,mime,blob){
  if(APP&&APP.saveFile){APP.saveFile(name,b64,mime);return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Downloaded ✓')}
function exportXlsx(list,fname){loadXLSX().then(()=>{
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rowsOf(list)),'Expenses');
  const months=[...new Set(list.map(e=>ym(e.ts)))].sort();
  const sm=S.cats.map(c=>{const o={Category:c.name};months.forEach(m=>o[monthName(m)]=sum(list.filter(e=>e.cat===c.id&&ym(e.ts)===m)));o.Total=sum(list.filter(e=>e.cat===c.id));return o}).filter(o=>o.Total);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sm),'Summary');
  deliver(fname+'.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
}).catch(e=>toast(e.message))}
function exportCsv(list,fname){
  const rows=rowsOf(list);const head=Object.keys(rows[0]);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[head.join(','),...rows.map(r=>head.map(h=>q(r[h])).join(','))].join('\r\n');
  deliver(fname+'.csv',b64of('﻿'+csv),'text/csv',new Blob(['﻿'+csv],{type:'text/csv'}));
}
function exportPdf(list,fname){
  const byC={};list.forEach(e=>byC[e.cat]=(byC[e.cat]||0)+e.amt);
  const cs=Object.entries(byC).sort((a,b)=>b[1]-a[1]);const tot=sum(list);const b=rangeBounds();
  const html='<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(fname)+'</title><style>'
  +'body{font:13px -apple-system,system-ui,sans-serif;color:#111;margin:26px}h1{font-size:20px;margin:0 0 2px}'
  +'.sub{color:#666;margin-bottom:16px}.tot{font-size:30px;font-weight:700;margin:0 0 14px}'
  +'table{width:100%;border-collapse:collapse;margin-top:10px}th{text-align:left;font-size:11px;color:#666;text-transform:uppercase;border-bottom:1px solid #ddd;padding:6px 4px}'
  +'td{padding:6px 4px;border-bottom:1px solid #f0f0f0}td.r,th.r{text-align:right}'
  +'.b{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:3px}.b i{display:block;height:100%}'
  +'@media print{body{margin:12mm}}</style></head><body>'
  +'<h1>Kharcha expense report</h1><div class="sub">'+esc(X.range==='all'?'All expenses':dmy(b[0])+' – '+dmy(Math.min(b[1],Date.now())))+' · '+list.length+' expenses</div>'
  +'<div class="tot">'+inr(tot)+'</div>'
  +'<table><tr><th>Category</th><th class="r">Amount</th><th class="r">Share</th></tr>'
  +cs.map((p,i)=>'<tr><td>'+esc(cat(p[0]).name)+'<div class="b"><i style="width:'+(p[1]/tot*100).toFixed(1)+'%;background:'+catColor(p[0],i)+'"></i></div></td><td class="r">'+inr(p[1])+'</td><td class="r">'+(p[1]/tot*100).toFixed(1)+'%</td></tr>').join('')
  +'</table><table><tr><th>Date</th><th>Paid to</th><th>Category</th><th>Mode</th><th class="r">Amount</th></tr>'
  +list.map(e=>'<tr><td>'+esc(dmy(e.ts))+'</td><td>'+esc(e.payee||'—')+(e.note?' <span style="color:#777">('+esc(e.note)+')</span>':'')+'</td><td>'+esc(cat(e.cat).name)+'</td><td>'+esc(e.mode)+'</td><td class="r">'+inr(e.amt)+'</td></tr>').join('')
  +'<tr><td colspan="4"><b>Total</b></td><td class="r"><b>'+inr(tot)+'</b></td></tr></table>'
  +'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print()},500)}</scr'+'ipt></body></html>';
  if(APP&&APP.openFile){APP.openFile(fname+'.html',b64of(html),'text/html');toast('Opening – choose Print → Save as PDF');return}
  const blob=new Blob([html],{type:'text/html'});
  const w=window.open(URL.createObjectURL(blob),'_blank');
  if(!w)deliver(fname+'.html',b64of(html),'text/html',blob);else toast('Choose Print → Save as PDF');
}

/* ---------- backup ---------- */
function backupTo(where){
  try{const txt=JSON.stringify({...S,backupAt:Date.now(),app:VERSION});
    const name='Kharcha-backup-'+new Date().toISOString().slice(0,10)+'.json';
    if(APP&&where==='pool'&&APP.shareFile)APP.shareFile(name,b64of(txt),'application/json',POOLDRIVE);
    else if(APP&&where==='share'&&APP.shareFile)APP.shareFile(name,b64of(txt),'application/json','');
    else deliver(name,b64of(txt),'application/json',new Blob([txt],{type:'application/json'}));
    S.lastBackup=Date.now();save();if(tab==='more')render();
  }catch(e){toast('Backup failed: '+e.message)}
}
async function restore(file){
  try{
    let data;
    if(/\.zip$/i.test(file.name)){await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
      const z=await JSZip.loadAsync(file);data=JSON.parse(await z.file('kharcha.json').async('string'))}
    else data=JSON.parse(await file.text());
    if(!Array.isArray(data.expenses))throw 0;
    if(!confirm('Restore '+data.expenses.length+' expenses? This replaces what is on this phone.'))return;
    S={v:2,expenses:data.expenses.filter(e=>e&&e.status!=='pending').map(e=>{const{att,...r}=e;return r}),
       cats:(data.cats&&data.cats.length?data.cats:DEF_CATS).map(c=>({id:c.id,name:c.name,emoji:c.emoji||EMO[c.id]||'🏷️'})),
       rules:data.rules||{},seen:data.seen||{},lastBackup:data.lastBackup,theme:S.theme};
    save();render();toast('Restored ✓');
  }catch(e){toast('Not a valid Kharcha backup')}
}

/* ---------- settings ---------- */
function ago(t){if(!t)return'never';const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d===1?'yesterday':d+' days ago'}
const SICO={bolt:['<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>','#d9f7ea','#0b6b47'],log:['<path d="M4 6h16M4 12h16M4 18h10"/>','#eef1ef','#3f4845'],
 tag:['<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.2"/>','#fff0de','#a35a00'],
 save:['<path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>','#e3eeff','#2556a8'],rest:['<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>','#e3eeff','#2556a8'],
 cloud:['<path d="M7 18a5 5 0 0 1-.6-10A6 6 0 0 1 18 9a4 4 0 0 1-1 9z"/>','#ece7ff','#5b44c9'],
 moon:['<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>','#eef1ef','#3f4845'],
 trash:['<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>','#fde7e5','#b42318']};
function sIco(k){const i=SICO[k];const d=darkOn();return '<span class="ico" style="background:'+(d?'#1e2724':i[1])+'"><svg viewBox="0 0 24 24" fill="none" stroke="'+(d?'#cfe0d9':i[2])+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+i[0]+'</svg></span>'}
const CHEV='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
function vMore(){
  const acc=APP&&APP.hasAccessibility&&APP.hasAccessibility();
  const pool=APP&&APP.hasApp&&APP.hasApp(POOLDRIVE);
  const old=APP&&!APP.shareFile;
  view.innerHTML=`<h2 class="g">Settings</h2>
  ${APP?`<div class="ghead">Capture</div><div class="card" style="padding:4px 16px">
    <div class="srow">${sIco('bolt')}<span class="s">Instant capture</span><span class="${acc?'on-pill':'off-pill'}">${acc?'ON':'OFF'}</span></div>
    <button class="srow" id="diagB">${sIco('log')}<span class="s">Capture log</span>${CHEV}</button>
  </div>${acc?'':'<button class="btn pri" id="accB">Turn on instant capture</button><div class="small muted" style="margin:8px 2px 0">Accessibility → Installed apps → Kharcha → On. Greyed out? <a href="#" id="accInfo" style="color:var(--okink)">App info</a> → ⋮ → Allow restricted settings.</div>'}`:''}
  <div class="ghead">Your data</div>
  <div class="card" style="padding:4px 16px">
    <button class="srow" id="catB">${sIco('tag')}<span class="s">Categories</span><span class="v">${S.cats.length}</span>${CHEV}</button>
    <button class="srow" id="expB">${sIco('save')}<span class="s">Export expenses (Excel, PDF, CSV)</span>${CHEV}</button>
    <button class="srow" id="nmB">${sIco('tag')}<span class="s">Payee names</span><span class="v">${Object.keys(S.names).length} named</span>${CHEV}</button>
    <button class="srow" id="bkSave">${sIco('save')}<span class="s">Save backup to phone</span><span class="v">${ago(S.lastBackup)}</span>${CHEV}</button>
    <label class="srow" style="cursor:pointer">${sIco('rest')}<span class="s">Restore from backup</span>${CHEV}<input type="file" accept=".json,.zip,application/json,application/zip" id="rs" hidden></label>
    ${APP&&!old?`<button class="srow" id="bkPool">${sIco('cloud')}<span class="s">${pool?'Back up to PoolDrive':'Back up to another app'}</span>${CHEV}</button>`:''}
  </div>
  ${old?'<div class="banner">A newer Kharcha app is available – install it to use every feature.</div>':''}
  <div class="ghead">Appearance</div>
  <div class="card" style="padding:4px 16px"><button class="srow" id="thB">${sIco('moon')}<span class="s">Theme</span><span class="v">${{system:'System',light:'Light',dark:'Dark'}[S.theme]}</span>${CHEV}</button></div>
  <div class="ghead">Danger zone</div>
  <div class="card" style="padding:4px 16px"><button class="srow" id="wipe">${sIco('trash')}<span class="s" style="color:var(--red)">Erase all data</span>${CHEV}</button></div>
  <div class="foot">Kharcha ${VERSION} · your data stays on this phone</div>`;
  if(APP){const ab=$('#accB');if(ab)ab.onclick=()=>APP.openAccessibilitySettings();
    const ai=$('#accInfo');if(ai)ai.onclick=e=>{e.preventDefault();APP.openAppInfo()};
    $('#diagB').onclick=diagSheet;
    const bp=$('#bkPool');if(bp)bp.onclick=()=>backupTo(pool?'pool':'share')}
  $('#bkSave').onclick=()=>backupTo('save');
  $('#rs').onchange=ev=>{const f=ev.target.files[0];if(f)restore(f)};
  $('#catB').onclick=catSheet;
  $('#expB').onclick=()=>{tab='export';render();scrollTo(0,0)};
  $('#nmB').onclick=()=>nameSheet();
  $('#thB').onclick=themeSheet;
  $('#wipe').onclick=()=>{if(confirm('Erase ALL expenses? Take a backup first!')&&confirm('Really erase everything?')){localStorage.removeItem(LS);S=load();save();render();toast('Erased')}};
}
function themeSheet(){
  openSheet(`<h3>Theme</h3>${segHtml('thS',['System','Light','Dark'],{system:'System',light:'Light',dark:'Dark'}[S.theme])}
  <div class="small muted" style="margin-top:10px">System follows your phone's dark mode.</div>
  <button class="btn pri" id="thDone">Done</button>`,sh=>{
    bindPick(sh.querySelector('#thS'),'data-m',v=>{S.theme=v.toLowerCase();save();applyTheme()});
    sh.querySelector('#thDone').onclick=()=>{closeSheet();render()}});
}
function catSheet(){
  openSheet(`<h3>Categories</h3><div id="cl">${S.cats.map(c=>`<div class="catrow">${icoHtml(c.id)}<span>${esc(c.name)}</span>${c.id==='other'?'':`<button data-del="${c.id}">Remove</button>`}</div>`).join('')}</div>
  <div class="row" style="margin-top:12px"><input id="nEmoji" placeholder="🙂" style="width:70px;flex:none;text-align:center" maxlength="4" aria-label="Emoji"><input id="nName" placeholder="New category"></div>
  <button class="btn" id="nAdd">Add category</button><button class="btn pri" id="cDone">Done</button>`,sh=>{
    sh.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=cat(b.dataset.del);const n=S.expenses.filter(e=>e.cat===c.id).length;
      if(!confirm('Remove “'+c.name+'”?'+(n?' '+n+' expenses move to Other.':'')))return;
      S.expenses.forEach(e=>{if(e.cat===c.id)e.cat='other'});S.cats=S.cats.filter(x=>x.id!==c.id);
      Object.keys(S.rules).forEach(k=>{if(S.rules[k]===c.id)delete S.rules[k]});save();catSheet()});
    sh.querySelector('#nAdd').onclick=()=>{const nm=sh.querySelector('#nName').value.trim();if(!nm)return toast('Type a name');
      S.cats.splice(S.cats.length-1,0,{id:'c'+uid(),name:nm,emoji:sh.querySelector('#nEmoji').value.trim()||'🏷️'});save();catSheet();toast('Added')};
    sh.querySelector('#cDone').onclick=()=>{closeSheet();render()}});
}
function diagSheet(){
  let log=[];try{log=JSON.parse(APP.getLog())}catch(e){}
  log=log.filter(l=>/screen/i.test(l.why||''));
  openSheet(`<h3>Capture log</h3><div class="small muted">Payment screens Kharcha has read (latest first).</div>
  ${log.length?log.map(l=>`<div class="mitem"><div class="top2"><b>${esc(String(l.t).split('\n')[0].replace(/^Screen:\s*/,''))}</b><span class="small muted">${dayLabel(l.ts)} ${tm(l.ts)}</span></div><div class="small muted" style="word-break:break-word">${esc((String(l.t).split('\n')[1]||'').replace(/^RAW:\s*/,''))}</div></div>`).join(''):'<div class="empty">Nothing yet. Make a payment, then check again.</div>'}
  <button class="btn pri" id="dOk">Close</button>`,sh=>{sh.querySelector('#dOk').onclick=closeSheet});
}

/* ---------- start ---------- */
applyTheme();render();
const qa=new URLSearchParams(location.search).get('a');
if(qa==='cash')addSheet({mode:'Cash'});
else if(qa==='add')addSheet();
else if(qa==='month'){tab='reports';RP.p='month';RP.anchor=Date.now();RP.cat=null;render()}
else if(qa==='money'){tab='money';render()}
else if(qa==='card'){tab='card';render()}
try{syncCardsNative()}catch(e){}
if(location.search)history.replaceState(null,'',location.pathname);
if(APP){syncNative();setTimeout(()=>window.kharchaPoll(),500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(()=>{window.kharchaPoll();render()},300)})}
else if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
