<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kharcha</title>
<style>
:root{
 --bg:#f3f5f2; --card:#ffffff; --card2:#f6f8f7; --ink:#0e1513; --mut:#5b6461; --faint:#8a9490;
 --line:#eef1ef; --edge:#e2e6e3; --ink2:#0e1513; --onink:#a9b8b2; --inkcard:#1e2a26;
 --accent:#5eeab4; --accentink:#0e1513; --red:#b42318; --redbg:#fde7e5; --okbg:#d9f7ea; --okink:#0b6b47;
 --sheet:#ffffff; --shadow:0 1px 2px rgba(15,23,42,.05);
}
html[data-theme="dark"]{
 --bg:#0a0e0d; --card:#141a18; --card2:#1a211f; --ink:#eef3f1; --mut:#9aa6a1; --faint:#7d8884;
 --line:#202825; --edge:#26302c; --ink2:#17201d; --inkcard:#22302b;
 --sheet:#141a18; --redbg:#3a1a17; --okbg:#10352a; --okink:#6fd9c4; --red:#ff8b7e;
 --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px 18px 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--edge);border-radius:14px;background:var(--card);color:var(--ink);outline:none;margin:0}
input:focus{border-color:var(--accent)}
svg{display:block}
.g{font-family:"Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.4px}
h2{font-size:23px;margin:6px 2px 14px;font-weight:700}
.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h4{margin:0 0 10px;font-size:15px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top .d{font-size:13px;color:var(--mut)}
.top .n{font-size:23px;font-weight:700}
.mbtn{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border:1px solid var(--edge);border-radius:20px;background:var(--card);font-size:13px;font-weight:600}
.hero{background:var(--ink2);border:1px solid var(--inkcard);border-radius:28px;padding:20px;color:#fff;display:flex;flex-direction:column;gap:12px}
html:not([data-theme="dark"]) .hero{background:#0e1513;border-color:#0e1513}
.hero .lbl{font-size:13px;color:var(--onink)}
.hero .big{font-size:44px;font-weight:700;letter-spacing:-1.6px;line-height:1}
.pill{padding:6px 10px;border-radius:12px;background:var(--inkcard);font-size:12px;font-weight:600;color:#e7f1ed}
html:not([data-theme="dark"]) .pill{background:#1e2a26}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px}
.spark div{flex:1;background:#2a3833;border-radius:3px;min-height:3px}
.spark div.on{background:var(--accent)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.quick button{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:18px;font-weight:700;font-size:15px}
.quick .a{background:var(--accent);color:var(--accentink)}
.quick .b{background:var(--card);border:1px solid var(--edge)}
.day{display:flex;justify-content:space-between;margin:20px 4px 8px;font-size:13px;font-weight:600;color:var(--mut)}
.list{background:var(--card);border-radius:22px;padding:2px 14px;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-weight:700;font-size:15px;white-space:nowrap}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.banner{display:block;width:100%;text-align:left;background:#fff7ed;color:#9a3412;border-radius:16px;padding:13px 15px;margin:12px 0 0;font-weight:600;font-size:14px}
html[data-theme="dark"] .banner{background:#2e1c0c;color:#fdba74}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 18px calc(18px + env(safe-area-inset-bottom));pointer-events:none;z-index:5}
.tabs .bar{pointer-events:auto;width:100%;max-width:524px;height:64px;border-radius:32px;background:#0e1513;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
html[data-theme="dark"] .tabs .bar{background:#17201d;border:1px solid #26302c}
.tabs button{width:48px;height:48px;border-radius:24px;display:grid;place-items:center}
.tabs button svg{width:22px;height:22px;fill:none;stroke:var(--onink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{background:#1e2a26}
html[data-theme="dark"] .tabs button.on{background:#22302b}
.tabs button.on svg{stroke:var(--accent)}
.tabs .plus{width:54px;height:54px;border-radius:27px;background:var(--accent)}
.tabs .plus svg{stroke:var(--accentink);stroke-width:2.4}
.ov{position:fixed;inset:0;background:rgba(5,10,9,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.ov.hidden{display:none}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease}
@keyframes up{from{transform:translateY(26px);opacity:.6}}
.grab{width:38px;height:5px;background:var(--edge);border-radius:3px;margin:6px auto 10px}
.sheet h3{margin:0 0 10px;font-size:19px;font-weight:700}
.amt{display:flex;align-items:baseline;justify-content:center;gap:5px;margin:14px 0 4px}
.amt span{font-size:28px;font-weight:600;color:var(--faint)}
.amt input{border:0;background:transparent;padding:0;width:auto;max-width:230px;font-size:50px;font-weight:700;letter-spacing:-2px;text-align:center;font-family:"Space Grotesk",Inter,sans-serif}
.seg{display:grid;gap:4px;padding:4px;background:var(--card2);border-radius:16px}
.seg button{height:40px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:#0e1513;color:#fff;font-weight:700}
html[data-theme="dark"] .seg button.on{background:var(--accent);color:#0e1513}
.lab{font-size:13px;font-weight:600;color:var(--mut);margin:16px 2px 8px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px 8px;border-radius:16px;background:var(--card2);border:2px solid transparent;font-size:11.5px;line-height:1.15}
.cats button .ico{width:34px;height:34px;border-radius:11px}
.cats button .ico svg{width:18px;height:18px}
.cats button.on{border-color:var(--ink);background:var(--card);font-weight:700}
html[data-theme="dark"] .cats button.on{border-color:var(--accent)}
.cats.err button{border-color:#fca5a5}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:18px;font-weight:700;font-size:15.5px;background:var(--card2);margin-top:10px;text-decoration:none;color:var(--ink)}
.btn.pri{background:#0e1513;color:#fff}
html[data-theme="dark"] .btn.pri{background:var(--accent);color:#0e1513}
.btn.danger{color:var(--red);background:transparent}
.row{display:flex;gap:10px}.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--edge);background:var(--card);font-size:13px;font-weight:600}
.chips button.on{background:#0e1513;color:#fff;border-color:#0e1513}
html[data-theme="dark"] .chips button.on{background:var(--accent);color:#0e1513;border-color:var(--accent)}
.mnav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:20px;padding:2px}
.mnav button{width:38px;height:38px;font-size:18px;color:var(--mut)}
.mnav b{font-size:13px;font-weight:600;padding:0 2px}
.badge{padding:6px 10px;border-radius:12px;background:var(--okbg);color:var(--okink);font-size:12px;font-weight:700;white-space:nowrap}
.badge.up{background:var(--redbg);color:var(--red)}
.leg{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;align-items:flex-end;gap:4px;height:92px;margin-top:12px}
.bars div{flex:1;border-radius:5px 5px 2px 2px;background:#cfe9df;min-height:3px}
html[data-theme="dark"] .bars div{background:#234038}
.bars div.hi{background:#0e1513}
html[data-theme="dark"] .bars div.hi{background:var(--accent)}
.dlab{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:6px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:52px;border-bottom:1px solid var(--line);font-size:15px}
.srow:last-child{border-bottom:0}
.srow .ico{width:32px;height:32px;border-radius:10px}
.srow .ico svg{width:17px;height:17px}
.srow .s{flex:1;min-width:0}
.srow .v{font-size:13.5px;color:var(--mut)}
.srow .chev{width:16px;height:16px;flex:none;stroke:var(--faint);stroke-width:2;fill:none;stroke-linecap:round}
.on-pill{padding:4px 10px;border-radius:10px;background:var(--okbg);color:var(--okink);font-size:12px;font-weight:700}
.off-pill{padding:4px 10px;border-radius:10px;background:var(--redbg);color:var(--red);font-size:12px;font-weight:700}
.ghead{font-size:12px;font-weight:700;color:var(--mut);margin:18px 8px 6px;text-transform:uppercase;letter-spacing:.7px}
.fmt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--edge);background:var(--card);text-align:left;margin-bottom:8px}
.fmt.on{border-color:var(--ink)}
html[data-theme="dark"] .fmt.on{border-color:var(--accent)}
.fmt .tag{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.fmt .t{flex:1}.fmt .t b{display:block;font-size:14.5px}.fmt .t small{display:block;color:var(--mut);font-size:12.5px}
.fmt .dot{width:22px;height:22px;border-radius:11px;border:2px solid var(--edge);display:grid;place-items:center;flex:none}
.fmt.on .dot{border-color:var(--ink)}
html[data-theme="dark"] .fmt.on .dot{border-color:var(--accent)}
.fmt .dot i{width:10px;height:10px;border-radius:5px;background:transparent}
.fmt.on .dot i{background:var(--ink)}
html[data-theme="dark"] .fmt.on .dot i{background:var(--accent)}
.catrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.catrow span{flex:1}
.catrow button{color:var(--red);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#0e1513;color:#fff;padding:11px 16px;border-radius:14px;z-index:30;font-size:14px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
html[data-theme="dark"] .toast{background:#273430}
.foot{text-align:center;color:var(--faint);font-size:12px;margin:18px 0 6px}
.mitem{padding:12px 0;border-bottom:1px solid var(--line)}.mitem:last-child{border-bottom:0}
.mitem .top2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tapbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 18px;border-radius:22px;border:2px dashed var(--edge);background:var(--card);text-align:center}
.tapbox.live{border-color:var(--accent);border-style:solid}
.wave{width:76px;height:76px;border-radius:38px;display:grid;place-items:center;background:var(--card2)}
.wave svg{width:34px;height:34px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round}
.tapbox.live .wave{background:var(--okbg);animation:pulse 1.4s ease-in-out infinite}
.tapbox.live .wave svg{stroke:var(--okink)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.balcard{background:#0e1513;border-radius:26px;padding:20px;color:#fff}
html[data-theme="dark"] .balcard{background:#17201d;border:1px solid #26302c}
.balcard .big{font-size:40px;font-weight:700;letter-spacing:-1.4px;line-height:1;margin:4px 0 6px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chead h2{margin-bottom:0}
.nfcb{flex:0 0 48px;width:48px;height:48px;border-radius:16px;background:var(--accent);color:#0e1513;display:flex;align-items:center;justify-content:center}
.nfcb svg,.cact svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.nfcb.live{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}
.cstrip{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -18px 0;padding:0 18px;scroll-padding:0 18px;scrollbar-width:none}
.cstrip::-webkit-scrollbar{display:none}
.ccard{flex:0 0 calc(100% - 52px);max-width:340px;box-sizing:border-box;height:164px;border-radius:24px;background:#1e2a26;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:center;opacity:.6;transition:opacity .2s}
.cstrip .ccard:only-child{flex-basis:100%;max-width:none}
.ccard.on{background:#0e1513;opacity:1}
html[data-theme="dark"] .ccard.on{background:#17201d;border:1px solid #26302c}
.ccard .ch{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;color:#a9b8b2}
.ccard .ch button{font-size:12px;color:#a9b8b2;padding:4px 9px;border-radius:9px;background:#ffffff14}
.ccard .cb{font-size:40px;font-weight:700;letter-spacing:-1.2px;line-height:1}
.ccard .cf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#a9b8b2}
.cdots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.cdots i{width:6px;height:6px;border-radius:3px;background:var(--edge);transition:width .2s}
.cdots i.on{width:18px;background:var(--ink)}
.cact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cact .btn{margin-top:0;height:48px;border-radius:16px;font-size:14px;gap:8px;background:var(--card)}
.cpill{margin-top:12px;padding:10px 14px;border-radius:14px;background:var(--okbg);color:var(--okink);font-size:13px;font-weight:600;text-align:center}
.cjs{padding:14px 16px 6px}
.cjh{display:flex;justify-content:space-between;align-items:baseline}
.cjh h4{margin:0;font-size:15px}
.cjh span{font-size:12px;color:var(--mut)}
.cjl{max-height:42vh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.cjd{font-size:12px;font-weight:600;color:var(--mut);margin-top:12px;text-transform:uppercase;letter-spacing:.6px}
.jrow .t small.ok{color:var(--okink)}
.jrow b.g{font-size:17px}
.jrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.jrow:last-child{border-bottom:0}
.jrow .t{flex:1;min-width:0}
.jrow .t b{display:block;font-size:14.5px;font-weight:600}
.jrow .t small{display:block;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs"><div class="bar" id="bar">
  <button data-t="home" class="on" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button data-t="reports" aria-label="Reports"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg></button>
  <button data-t="card" aria-label="Travel card"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg></button>
  <button data-t="add" class="plus" aria-label="Add expense"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-t="export" aria-label="Export"><svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></button>
  <button data-t="more" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
</div></nav>
<div id="ov" class="ov hidden"><div class="sheet" id="sheet"></div></div>

<script>
const VERSION='5.3';
const APP=window.KharchaApp||null;
const POOLDRIVE='io.github.dhbhojani12.pooldrive';

/* ---------- categories ---------- */
const ICONS={
 food:['<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 0-3 2-3 6s1 4 3 4"/>','#ffe8d6','#b4540a','#3a2616','#ffb27a','#f08a3c'],
 groc:['<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.5 12h11L21 7H6"/>','#e3f5d8','#3f7a12','#1c2e14','#a5db7c','#6dbf3a'],
 travel:['<path d="M4 13l2-6h12l2 6v4H4zM6 17v2M18 17v2M4 13h16"/>','#dcebff','#1d5fbf','#18283f','#8db8ff','#4a8cf0'],
 shop:['<path d="M6 7h12l1 14H5zM9 7a3 3 0 0 1 6 0"/>','#fde2f0','#a3246a','#3a1428','#f59ec6','#e05c9c'],
 bills:['<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>','#fff4cc','#8a6500','#352a08','#e8c45c','#d8a52a'],
 study:['<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-2 1"/>','#e8e4ff','#5b44c9','#241d45','#b2a4ff','#7c63e8'],
 health:['<path d="M9 6h6v3h3v6h-3v3H9v-3H6V9h3z"/>','#ffe3e3','#b4321f','#3a1715','#ff9a8c','#e8614a'],
 fun:['<path d="M4 5h16v14H4zM4 9h16M8 5v4M16 5v4M9 13l5 3-5 3z"/>','#e6e9ff','#3b47b8','#1b2047','#9aa6ff','#5d6ae0'],
 friends:['<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M16 5a3 3 0 0 1 0 6M21 20c0-2-1.5-4-4-4.6"/>','#e0f2ef','#0f6b5e','#14302a','#6fd9c4','#2bb39b'],
 home:['<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>','#efe9e2','#6b5540','#2c241c','#d5bfa6','#a3835f'],
 gift:['<path d="M3 9h18v4H3zM5 13h14v8H5zM12 9v12M12 9c-3 0-5-1-5-3s3-2 5 3c2-5 5-5 5-3s-2 3-5 3z"/>','#ffe1ea','#b32a52','#3a1521','#f58fab','#e2577f'],
 other:['<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>','#eceef0','#4b5563','#232a2f','#aeb8c2','#6b7785']};
const PALETTE=['#f08a3c','#6dbf3a','#4a8cf0','#e05c9c','#d8a52a','#7c63e8','#e8614a','#5d6ae0','#2bb39b','#a3835f','#e2577f','#6b7785'];
const EMO={food:'🍔',groc:'🛒',travel:'🚕',shop:'🛍️',bills:'💡',study:'📚',health:'💊',fun:'🎬',friends:'🤝',home:'🏠',gift:'🎁',other:'📦'};
const DEF_CATS=[['food','Food'],['groc','Groceries'],['travel','Travel'],['shop','Shopping'],['bills','Bills'],['study','Study'],['health','Health'],['fun','Fun'],['friends','Friends'],['home','Home'],['gift','Gifts'],['other','Other']].map(([id,name])=>({id,name,emoji:EMO[id]}));
const MODES=['UPI','Cash','Card','Bank'];

/* ---------- data ---------- */
const LS='kharcha.v1';
let S=load();
function load(){
  try{const s=JSON.parse(localStorage.getItem(LS));
    if(s&&Array.isArray(s.expenses)){
      s.cats=(s.cats&&s.cats.length?s.cats:DEF_CATS.slice()).map(c=>({id:c.id,name:c.name,emoji:c.emoji||EMO[c.id]||'🏷️'}));
      s.rules=s.rules||{};s.seen=s.seen||{};s.theme=s.theme||'system';
      s.expenses=s.expenses.filter(e=>e&&e.status!=='pending').map(e=>{const{att,...r}=e;return r});
      return s}}catch(e){}
  return{v:2,expenses:[],cats:DEF_CATS.slice(),rules:{},seen:{},theme:'system'};
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Could not save – storage full?')}syncNative()}
function syncNative(){if(APP&&APP.setCats){try{APP.setCats(JSON.stringify(S.cats.map(c=>({id:c.id,name:c.name,emoji:c.emoji||EMO[c.id]||'🏷️'}))));APP.setRules(JSON.stringify(S.rules))}catch(e){}}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const view=$('#view');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const inr=n=>'₹'+(Math.round(n*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat=id=>S.cats.find(c=>c.id===id)||S.cats.find(c=>c.id==='other')||{id:'other',name:'Other',emoji:'📦'};
const key=s=>(s||'').toLowerCase().replace(/[^a-z0-9@.]/g,'');
const ym=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const monthName=m=>{const[y,mm]=m.split('-');return MN[+mm-1]+' '+y};
const sod=d=>{d=new Date(d);d.setHours(0,0,0,0);return d.getTime()};
const sameDay=(a,b)=>sod(a)===sod(b);
const sum=a=>a.reduce((s,e)=>s+e.amt,0);
const tm=t=>new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});
function dayLabel(t){const n=Date.now();if(sameDay(t,n))return'Today';if(sameDay(t,n-864e5))return'Yesterday';const d=new Date(t);return d.getDate()+' '+MN[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')}
function dtLocal(t){const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
const dmy=t=>{const d=new Date(t);return d.getDate()+' '+MN[d.getMonth()]+' '+d.getFullYear()};
const iso=t=>{const d=new Date(t);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Needs internet the first time'));document.head.appendChild(s)})}
const loadXLSX=()=>window.XLSX?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100)/100:0};
const darkOn=()=>S.theme==='dark'||(S.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
function applyTheme(){const d=darkOn();document.documentElement.dataset.theme=d?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#0a0e0d':'#f3f5f2'}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()})}catch(e){}
function icoHtml(id){const i=ICONS[id]||ICONS.other;const d=darkOn();
  return `<span class="ico" style="background:${d?i[3]:i[1]}"><svg viewBox="0 0 24 24" stroke="${d?i[4]:i[2]}">${i[0]}</svg></span>`}
const catColor=(id,n)=>(ICONS[id]?ICONS[id][5]:null)||PALETTE[n%PALETTE.length];

const KW=[[/swiggy|zomato|domino|mcdonald|kfc|pizza|cafe|restaurant|hotel|food|bakery|chai|tea|canteen|burger|starbucks/i,'food'],
[/blinkit|zepto|bigbasket|dmart|instamart|grocer|kirana|supermarket|jiomart|milk|dairy/i,'groc'],
[/uber|ola|rapido|irctc|metro|railway|petrol|fuel|indianoil|iocl|hpcl|bpcl|fastag|redbus|makemytrip|indigo|parking/i,'travel'],
[/amazon|flipkart|myntra|ajio|meesho|nykaa|croma|decathlon/i,'shop'],
[/airtel|jio|vodafone|\bvi\b|bsnl|electric|power|recharge|broadband|gas|bill|dth/i,'bills'],
[/icai|book|udemy|course|coaching|xerox|stationery|exam/i,'study'],
[/apollo|pharm|medplus|hospital|clinic|1mg|netmeds|chemist|medical/i,'health'],
[/netflix|spotify|hotstar|bookmyshow|prime|pvr|inox|youtube/i,'fun']];
const guessCat=s=>{for(const[r,c]of KW)if(r.test(s||''))return S.cats.some(x=>x.id===c)?c:'';return''};
const suggest=(payee,extra)=>S.rules[key(payee)]||guessCat([payee,extra].join(' '));
function learn(payee,c){if(payee&&c)S.rules[key(payee)]=c}
const catGrid=(sel,id)=>`<div class="cats" id="${id}">${S.cats.map(c=>`<button type="button" data-c="${c.id}" class="${c.id===sel?'on':''}">${icoHtml(c.id)}${esc(c.name)}</button>`).join('')}</div>`;
function bindPick(el,attr,cb){el.addEventListener('click',ev=>{const b=ev.target.closest(`button[${attr}]`);if(!b)return;el.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');el.classList.remove('err');cb&&cb(b.getAttribute(attr))})}
const picked=(el,attr)=>{const b=el.querySelector('button.on');return b?b.getAttribute(attr):''};
const segHtml=(id,opts,sel)=>`<div class="seg" id="${id}" style="grid-template-columns:repeat(${opts.length},1fr)">${opts.map(o=>`<button type="button" data-m="${esc(o)}" class="${o===sel?'on':''}">${esc(o)}</button>`).join('')}</div>`;

/* ---------- sheet ---------- */
function openSheet(html,mount){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#ov').classList.remove('hidden');mount&&mount($('#sheet'))}
function closeSheet(){$('#ov').classList.add('hidden');$('#sheet').innerHTML='';if(Q.length)setTimeout(nextQueued,300)}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});

/* ---------- add / edit ---------- */
function addSheet(e){
  const x=Object.assign({amt:'',cat:'',mode:'UPI',payee:'',note:'',ts:Date.now()},e||{});
  openSheet(`<h3>${x.id?'Edit expense':'Add expense'}</h3>
  <div class="amt"><span>₹</span><input id="fAmt" inputmode="decimal" placeholder="0" value="${x.amt||''}" aria-label="Amount"></div>
  <div class="small muted" style="text-align:center">${esc(dayLabel(x.ts))} · ${esc(tm(x.ts))}</div>
  <div style="margin-top:14px">${segHtml('fMode',MODES,x.mode)}</div>
  <div class="lab">Category</div>
  ${catGrid(x.cat,'fCats')}
  <div class="lab">Details</div>
  <input id="fPayee" placeholder="Paid to" value="${esc(x.payee)}" style="margin-bottom:8px">
  <input id="fNote" placeholder="Note (optional)" style="margin-bottom:8px">
  <input id="fTs" type="datetime-local" value="${dtLocal(x.ts)}" aria-label="Date and time">
  <button class="btn pri" id="fSave">Save</button>
  ${x.id?'<button class="btn danger" id="fDel">Delete expense</button>':''}`,sh=>{
    sh.querySelector('#fNote').value=x.note||'';
    const cats=sh.querySelector('#fCats');bindPick(cats,'data-c');bindPick(sh.querySelector('#fMode'),'data-m');
    sh.querySelector('#fPayee').addEventListener('change',ev=>{if(!picked(cats,'data-c')){const s=suggest(ev.target.value);if(s){const b=cats.querySelector('[data-c="'+s+'"]');if(b)b.classList.add('on')}}});
    if(!x.id)setTimeout(()=>{const a=sh.querySelector('#fAmt');if(a)a.focus()},150);
    sh.querySelector('#fSave').onclick=()=>{
      const amt=parseAmt(sh.querySelector('#fAmt').value);if(!amt){toast('Enter an amount');return}
      const c=picked(cats,'data-c');if(!c){cats.classList.add('err');toast('Pick a category');return}
      const r={...x,amt,cat:c,mode:picked(sh.querySelector('#fMode'),'data-m')||'UPI',payee:sh.querySelector('#fPayee').value.trim(),note:sh.querySelector('#fNote').value.trim(),ts:new Date(sh.querySelector('#fTs').value).getTime()||Date.now()};
      if(x.id){const i=S.expenses.findIndex(z=>z.id===x.id);S.expenses[i]=r}else{r.id=uid();r.src=x.src||'manual';S.expenses.push(r)}
      learn(r.payee,c);save();closeSheet();render();toast('Saved ✓')};
    const d=sh.querySelector('#fDel');if(d)d.onclick=()=>{if(!confirm('Delete this expense?'))return;S.expenses=S.expenses.filter(z=>z.id!==x.id);save();closeSheet();render();toast('Deleted')};
  });
}

/* ---------- payments captured by the Android app ---------- */
let Q=[];
function importDone(it){
  const c=S.cats.some(x=>x.id===it.cat)?it.cat:'other';
  if(S.expenses.some(e=>e.src==='auto'&&e.ts===it.ts))return;
  S.expenses.push({id:uid(),amt:it.amt,cat:c,payee:it.payee||'',note:it.note||'',mode:'UPI',ts:it.ts,src:'auto'});
  learn(it.payee,c);
}
function parseCapture(t){t=String(t||'');const m=t.match(/₹\s*([\d,]+(?:\.\d{1,2})?)/);const p=t.match(/ to (.+?)\.?$/m);return{amt:m?parseAmt(m[1]):0,payee:p?p[1].trim():''}}
function nextQueued(){if(!Q.length||!$('#ov').classList.contains('hidden'))return;const it=Q.shift();const{amt,payee}=parseCapture(it.t);addSheet({amt,payee,cat:suggest(payee),mode:'UPI',ts:it.ts||Date.now(),src:'auto'});if(Q.length)setTimeout(()=>toast(Q.length+' more to tag'),400)}
window.kharchaPoll=function(){if(!APP)return;try{const a=JSON.parse(APP.takePending()||'[]');let n=0;a.forEach(it=>{if(it.done){importDone(it);n++}else Q.push(it)});if(n){save();render()}nextQueued()}catch(e){}};

$('#bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;

function render(){applyTheme();

function itemRow(e){const c=cat(e.cat);
  return `<button class="item" data-id="${e.id}">${icoHtml(c.id)}<div class="t"><b>${esc(e.payee||c.name)}</b><small>${esc(c.name)}${e.note?' · '+esc(e.note):''} · ${esc(e.mode)} · ${esc(tm(e.ts))}</small></div><div class="a">${inr(e.amt)}</div></button>`}
function groupList(arr){
  if(!arr.length)return`<div class="empty">No expenses yet.${APP?'<br>Pay with Samsung Wallet or GPay – Kharcha will ask you to tag it.':''}</div>`;
  const g={};arr.forEach(e=>{const k=sod(e.ts);(g[k]=g[k]||[]).push(e)});
  return Object.keys(g).sort((a,b)=>b-a).map(k=>`<div class="day"><span>${dayLabel(+k)}</span><span>${inr(sum(g[k]))}</span></div><div class="list">${g[k].map(itemRow).join('')}</div>`).join('');
}
function bindItems(root){root.addEventListener('click',ev=>{const b=ev.target.closest('.item[data-id]');if(!b)return;const e=S.expenses.find(x=>x.id===b.dataset.id);if(e)addSheet(e)})}

  <div class="card"><h4>Top places &amp; people</h4>${ps.map(([p,o])=>`<div class="srow"><div class="s"><b style="font-weight:600;font-size:14.5px">${esc(p)}</b><div class="small muted">${o.n} time${o.n>1?'s':''}</div></div><b>${inr(o.a)}</b></div>`).join('')}</div>

  $('#mPrev').onclick=()=>{month=prevM;render()};

/* ---------- travel card (NFC) ---------- */
/* Each card is kept on its own, keyed by its number. Spending between taps is
   worked out as: previous balance + top-ups recorded since then - balance now. */
const CARDK='kharcha.cards';
let cardsBusy=false,cardErr=null,selCard=null;
function loadCards(){try{const c=JSON.parse(localStorage.getItem(CARDK));if(c&&c.list)return c}catch(e){}
  // carry over a card saved by the first version
  try{const o=JSON.parse(localStorage.getItem('kharcha.card'));
    if(o&&o.balance!=null){const id=o.pan||'card';return{list:{[id]:{...o,id,topups:[]}}}}}catch(e){}
  return{list:{}}}
function saveCards(c){try{localStorage.setItem(CARDK,JSON.stringify(c))}catch(e){}}
const cardList=()=>Object.values(loadCards().list).sort((a,b)=>(b.readAt||0)-(a.readAt||0));
const jkey=j=>j.v===2?'v2-'+j.seq+'-'+j.ts:[j.seq,j.mins,j.term,j.op].join('-');
const realJourneys=c=>(c.journeys||[]).filter(j=>j.v===2); // older builds misread the log; ignore those
const cardName=c=>c.name||c.cardType||'Travel card';

/** spent since the previous tap, allowing for top-ups the user recorded */
function spendInfo(c){
  if(c.prevBalance==null||c.balance==null)return null;
  const tops=(c.topups||[]).filter(t=>t.ts>(c.prevReadAt||0)&&t.ts<=(c.readAt||Date.now()));
  const topped=tops.reduce((s,t)=>s+t.amt,0);
  const spent=Math.round((c.prevBalance+topped-c.balance)*100)/100;
  return{spent,topped,unexplained:spent<-0.005};
}

window.kharchaCard=function(res){
  cardsBusy=false;
  if(!res||res.error){cardErr=(res&&res.error)||'Could not read the card';render();return}
  cardErr=null;
  const store=loadCards();
  const id=res.pan||res.aid||'card';
  const prev=store.list[id]||{};
  if(Array.isArray(res.journeys)){const seen={};res.journeys=res.journeys.filter(j=>{const k=jkey(j);if(seen[k])return false;seen[k]=1;return true}).sort((a,b)=>((b.ts||0)-(a.ts||0))||((b.seq||0)-(a.seq||0)))}
  const c={...prev,...res,id,language:undefined,
    name:prev.name,
    topups:prev.topups||[],
    known:prev.known||{},
    readAt:Date.now(),
    prevBalance:(prev.balance!=null?prev.balance:null),
    prevReadAt:(prev.readAt||null)};

function importJourneys(id){

    payee:cardName(c),note:'Card spend since last tap',mode:'Card',ts:Date.now(),src:'nfc'});

function cardPill(c){

  if(pend>0)return`+${inr(pend)} topped up – tap to refresh`;
  if(si&&si.unexplained)return`Balance went up ${inr(-si.spent)} – record the top-up`;
  if(si&&si.spent>0)return`Spent ${inr(si.spent)} since last tap`;

const X={range:'month',cats:'all',fmt:'xlsx',from:null,to:null};
function rangeBounds(){

  if(X.range==='last')return[new Date(y,mm-2,1).getTime(),new Date(y,mm-1,1).getTime()-1];
  if(X.range==='all')return[0,now];

}

async function restore(file){

      const z=await JSZip.loadAsync(file);data=JSON.parse(await z.file('kharcha.json').async('string'))}
    else data=JSON.parse(await file.text());
    if(!Array.isArray(data.expenses))throw 0;
    if(!confirm('Restore '+data.expenses.length+' expenses? This replaces what is on this phone.'))return;
    S={v:2,expenses:data.expenses.filter(e=>e&&e.status!=='pending').map(e=>{const{att,...r}=e;return r}),
       cats:(data.cats&&data.cats.length?data.cats:DEF_CATS).map(c=>({id:c.id,name:c.name,emoji:c.emoji||EMO[c.id]||'🏷️'})),
       rules:data.rules||{},seen:data.seen||{},lastBackup:data.lastBackup,theme:S.theme};
    save();render();toast('Restored ✓');
  }catch(e){toast('Not a valid Kharcha backup')}
}

/* ---------- settings ---------- */
function ago(t){if(!t)return'never';const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d===1?'yesterday':d+' days ago'}
const SICO={bolt:['<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>','#d9f7ea','#0b6b47'],log:['<path d="M4 6h16M4 12h16M4 18h10"/>','#eef1ef','#3f4845'],
 tag:['<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.2"/>','#fff0de','#a35a00'],
 save:['<path d="M12 3v12M7 10l5 5 5-5M4 19h16"/>','#e3eeff','#2556a8'],rest:['<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>','#e3eeff','#2556a8'],
 cloud:['<path d="M7 18a5 5 0 0 1-.6-10A6 6 0 0 1 18 9a4 4 0 0 1-1 9z"/>','#ece7ff','#5b44c9'],
 moon:['<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>','#eef1ef','#3f4845'],
 trash:['<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>','#fde7e5','#b42318']};
function sIco(k){const i=SICO[k];const d=darkOn();return '<span class="ico" style="background:'+(d?'#1e2724':i[1])+'"><svg viewBox="0 0 24 24" fill="none" stroke="'+(d?'#cfe0d9':i[2])+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+i[0]+'</svg></span>'}
const CHEV='<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
function vMore(){
  const acc=APP&&APP.hasAccessibility&&APP.hasAccessibility();
  const pool=APP&&APP.hasApp&&APP.hasApp(POOLDRIVE);
  const old=APP&&!APP.shareFile;
  view.innerHTML=`<h2 class="g">Settings</h2>
  ${APP?`<div class="ghead">Capture</div><div class="card" style="padding:4px 16px">
    <div class="srow">${sIco('bolt')}<span class="s">Instant capture</span><span class="${acc?'on-pill':'off-pill'}">${acc?'ON':'OFF'}</span></div>
    <button class="srow" id="diagB">${sIco('log')}<span class="s">Capture log</span>${CHEV}</button>
  </div>${acc?'':'<button class="btn pri" id="accB">Turn on instant capture</button><div class="small muted" style="margin:8px 2px 0">Accessibility → Installed apps → Kharcha → On. Greyed out? <a href="#" id="accInfo" style="color:var(--okink)">App info</a> → ⋮ → Allow restricted settings.</div>'}`:''}
  <div class="ghead">Your data</div>
  <div class="card" style="padding:4px 16px">
    <button class="srow" id="catB">${sIco('tag')}<span class="s">Categories</span><span class="v">${S.cats.length}</span>${CHEV}</button>
    <button class="srow" id="bkSave">${sIco('save')}<span class="s">Save backup to phone</span><span class="v">${ago(S.lastBackup)}</span>${CHEV}</button>
    <label class="srow" style="cursor:pointer">${sIco('rest')}<span class="s">Restore from backup</span>${CHEV}<input type="file" accept=".json,.zip,application/json,application/zip" id="rs" hidden></label>
    ${APP&&!old?`<button class="srow" id="bkPool">${sIco('cloud')}<span class="s">${pool?'Back up to PoolDrive':'Back up to another app'}</span>${CHEV}</button>`:''}
  </div>
  ${old?'<div class="banner">A newer Kharcha app is available – install it to use every feature.</div>':''}
  <div class="ghead">Appearance</div>
  <div class="card" style="padding:4px 16px"><button class="srow" id="thB">${sIco('moon')}<span class="s">Theme</span><span class="v">${{system:'System',light:'Light',dark:'Dark'}[S.theme]}</span>${CHEV}</button></div>
  <div class="ghead">Danger zone</div>
  <div class="card" style="padding:4px 16px"><button class="srow" id="wipe">${sIco('trash')}<span class="s" style="color:var(--red)">Erase all data</span>${CHEV}</button></div>
  <div class="foot">Kharcha ${VERSION} · your data stays on this phone</div>`;
  if(APP){const ab=$('#accB');if(ab)ab.onclick=()=>APP.openAccessibilitySettings();
    const ai=$('#accInfo');if(ai)ai.onclick=e=>{e.preventDefault();APP.openAppInfo()};
    $('#diagB').onclick=diagSheet;
    const bp=$('#bkPool');if(bp)bp.onclick=()=>backupTo(pool?'pool':'share')}
  $('#bkSave').onclick=()=>backupTo('save');
  $('#rs').onchange=ev=>{const f=ev.target.files[0];if(f)restore(f)};
  $('#catB').onclick=catSheet;
  $('#thB').onclick=themeSheet;
  $('#wipe').onclick=()=>{if(confirm('Erase ALL expenses? Take a backup first!')&&confirm('Really erase everything?')){localStorage.removeItem(LS);S=load();save();render();toast('Erased')}};
}
function themeSheet(){
  openSheet(`<h3>Theme</h3>${segHtml('thS',['System','Light','Dark'],{system:'System',light:'Light',dark:'Dark'}[S.theme])}
  <div class="small muted" style="margin-top:10px">System follows your phone's dark mode.</div>
  <button class="btn pri" id="thDone">Done</button>`,sh=>{
    bindPick(sh.querySelector('#thS'),'data-m',v=>{S.theme=v.toLowerCase();save();applyTheme()});
    sh.querySelector('#thDone').onclick=()=>{closeSheet();render()}});
}
function catSheet(){
  openSheet(`<h3>Categories</h3><div id="cl">${S.cats.map(c=>`<div class="catrow">${icoHtml(c.id)}<span>${esc(c.name)}</span>${c.id==='other'?'':`<button data-del="${c.id}">Remove</button>`}</div>`).join('')}</div>
  <div class="row" style="margin-top:12px"><input id="nEmoji" placeholder="🙂" style="width:70px;flex:none;text-align:center" maxlength="4" aria-label="Emoji"><input id="nName" placeholder="New category"></div>
  <button class="btn" id="nAdd">Add category</button><button class="btn pri" id="cDone">Done</button>`,sh=>{
    sh.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const c=cat(b.dataset.del);const n=S.expenses.filter(e=>e.cat===c.id).length;
      if(!confirm('Remove “'+c.name+'”?'+(n?' '+n+' expenses move to Other.':'')))return;
      S.expenses.forEach(e=>{if(e.cat===c.id)e.cat='other'});S.cats=S.cats.filter(x=>x.id!==c.id);
      Object.keys(S.rules).forEach(k=>{if(S.rules[k]===c.id)delete S.rules[k]});save();catSheet()});
    sh.querySelector('#nAdd').onclick=()=>{const nm=sh.querySelector('#nName').value.trim();if(!nm)return toast('Type a name');
      S.cats.splice(S.cats.length-1,0,{id:'c'+uid(),name:nm,emoji:sh.querySelector('#nEmoji').value.trim()||'🏷️'});save();catSheet();toast('Added')};
    sh.querySelector('#cDone').onclick=()=>{closeSheet();render()}});
}
function diagSheet(){
  let log=[];try{log=JSON.parse(APP.getLog())}catch(e){}
  log=log.filter(l=>/screen/i.test(l.why||''));
  openSheet(`<h3>Capture log</h3><div class="small muted">Payment screens Kharcha has read (latest first).</div>
  ${log.length?log.map(l=>`<div class="mitem"><div class="top2"><b>${esc(String(l.t).split('\n')[0].replace(/^Screen:\s*/,''))}</b><span class="small muted">${dayLabel(l.ts)} ${tm(l.ts)}</span></div><div class="small muted" style="word-break:break-word">${esc((String(l.t).split('\n')[1]||'').replace(/^RAW:\s*/,''))}</div></div>`).join(''):'<div class="empty">Nothing yet. Make a payment, then check again.</div>'}
  <button class="btn pri" id="dOk">Close</button>`,sh=>{sh.querySelector('#dOk').onclick=closeSheet});
}

/* ---------- start ---------- */
applyTheme();render();
const qa=new URLSearchParams(location.search).get('a');
if(qa==='cash')addSheet({mode:'Cash'});
else if(qa==='add')addSheet();
else if(qa==='month'){tab='reports';month=ym(Date.now());render()}
if(location.search)history.replaceState(null,'',location.pathname);
if(APP){syncNative();setTimeout(()=>window.kharchaPoll(),500);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')setTimeout(()=>{window.kharchaPoll();render()},300)})}
else if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
